 V.idx=Math.min(V.idx,L.length-1);
 $('#list').innerHTML=V.mode==='one'?card(L[V.idx]):L.map(card).join('');pager()}
function quiz(){let a=baseQs().filter(FILT[V.f]);L=V.seed?shuf(a,V.seed):a;bar();draw()}
function days14(){const a=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push({n:S.days[dkey(d)]||0,l:d.getDate()+'/'+(d.getMonth()+1)})}return a}
function spark(v,c){const m=Math.max(1,...v),w=120,h=36,p=v.map((x,i)=>`${(i*w/(v.length-1)).toFixed(1)},${(h-3-x*(h-8)/m).toFixed(1)}`).join(' ');return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="spk"><polyline points="${p}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`}
function area(v){const w=600,h=180,m=Math.max(5,...v),pt=v.map((x,i)=>[i*w/(v.length-1),h-12-x*(h-34)/m]),ln=pt.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
 return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="ar"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B6CFF" stop-opacity=".55"/><stop offset="1" stop-color="#8B6CFF" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3].map(i=>`<line x1="0" x2="${w}" y1="${10+i*(h-32)/3}" y2="${10+i*(h-32)/3}" stroke="currentColor" opacity=".12"/>`).join('')}<path d="${ln}L${w} ${h}L0 ${h}Z" fill="url(#ag)"/><path d="${ln}" fill="none" stroke="#A78BFF" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`}
function gauge(p){const L2=Math.PI*80;return `<svg viewBox="0 0 200 118" class="ga"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#6A46F0"/><stop offset="1" stop-color="#C084FC"/></linearGradient></defs><path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="currentColor" opacity=".14" stroke-width="12" stroke-linecap="round"/><path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="url(#gg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${L2*p} ${L2}"/><text x="100" y="86" text-anchor="middle" font-size="38" font-weight="700" fill="currentColor">${Math.round(p*100)}</text><text x="100" y="106" text-anchor="middle" font-size="11" fill="currentColor" opacity=".6">/100</text></svg>`}
const stat=(l,v,s,z)=>`<div class="st"><div class="sl">${l}</div><div class="sv">${v}</div><div class="ss">${s}</div>${z}</div>`;
const pill=q=>S.res[q.id]&&!S.res[q.id].ok?['bad','Làm sai']:S.marks[q.id]?['warn','Đã đánh dấu']:S.res[q.id]?['ok','Đúng']:['pu','Chưa làm'];
function home(){
 const s=sum(),d14=days14(),td=d14[13].n,rd=s.ok/Qs.length,tot=d14.reduce((a,x)=>a+x.n,0);
 const w=Qs.filter(FILT.wrong),rows=[...w,...Qs.filter(q=>S.marks[q.id]&&!w.includes(q)),...Qs.filter(FILT.new)].slice(0,6);
 const lab=rd<.3?'Mới bắt đầu':rd<.6?'Đang tiến bộ':rd<.85?'Khá vững':'Sẵn sàng thi';
 const col=['eda','bash','x','tcl','bash','eda'];
 const bento=P.map((p,i)=>{if(!i)return'';const qs=Qs.filter(q=>q.pi===i),ok=qs.filter(q=>S.res[q.id]&&S.res[q.id].ok).length,bd=qs.filter(q=>S.res[q.id]&&!S.res[q.id].ok).length;
  return `<button class="bc" data-c="${col[(i-1)%6]}" data-go="${qs.length?'part':'doc'}" data-p="${i}" data-s="0"><span class="orb">${ic(qs.length?'term':'book')}</span><b>${esc(p.title)}</b><small>${qs.length?`${qs.length} câu hỏi, ${p.sections.length} mục`:`${p.sections.length-1} lab thực chiến, có code mẫu`}</small>${qs.length?`<div class="pb"><i style="width:${ok*100/qs.length}%"></i><i style="width:${bd*100/qs.length}%"></i></div><small>${ok+bd}/${qs.length} đã làm</small>`:''}</button>`}).join('');
 $('#bar').innerHTML=`<section class="hero"><div class="bdg"><i></i>Ngân hàng ${Qs.length} câu, Chương 1 đến 6</div><h1>Ôn Bash + Tcl cho EDA, nhớ lâu từng câu.</h1><p>Làm trắc nghiệm có giải thích ngay, đánh dấu câu hay sai và ôn lại đúng chỗ cần.</p><button class="pri" data-act="start" data-f="new">Bắt đầu ôn tập</button><button class="gh" data-act="start" data-f="mark">Câu đã đánh dấu (${s.mk})</button></section>
 <section class="dash panel"><div class="dh"><h2>Tổng quan</h2><span>14 ngày gần nhất</span></div>
 <div class="sg">${stat('Câu đã làm',s.d,`+${td} hôm nay`,spark(d14.map(x=>x.n),'#8B6CFF'))}${stat('Độ chính xác',(s.d?Math.round(s.ok*100/s.d):0)+'%',`${s.ok} đúng, ${s.wr} sai`,`<div class="pb" style="margin-top:14px"><i style="width:${s.d?s.ok*100/s.d:0}%"></i></div>`)}${stat('Đã đánh dấu',s.mk,'cần ôn lại',`<button class="gh sm" style="margin-top:8px" data-act="start" data-f="mark">Ôn ngay</button>`)}${stat('Chuỗi ngày','🔥 '+streak(),`hôm nay ${td}/20 câu`,`<div class="pb" style="margin-top:14px"><i style="width:${Math.min(100,td*5)}%"></i></div>`)}</div>
 <div class="dr"><div class="bx"><h3>Số câu làm mỗi ngày</h3>${area(d14.map(x=>x.n))}<div class="dl"><span>${d14[0].l}</span><span>${tot?`${tot} câu trong 14 ngày`:'Làm vài câu để biểu đồ lên số'}</span><span>${d14[13].l}</span></div></div><div class="bx"><h3>Mức sẵn sàng</h3>${gauge(rd)}<div class="gl">${lab}</div><div class="dl" style="justify-content:center">${s.ok}/${Qs.length} câu đã đúng</div></div></div>
 <div class="bx"><h3>Câu cần ôn</h3><div class="tw"><table><thead><tr><th>Câu</th><th>Nội dung</th><th>Chủ đề</th><th>Trạng thái</th><th></th></tr></thead><tbody>${rows.map(q=>{const p=pill(q),c=catQ(q),t=clean(q.q);return `<tr><td class="mo">#${q.id}</td><td>${esc(t.length>72?t.slice(0,72)+'…':t)}</td><td><span class="ct" data-c="${c}">${CN[c]}</span></td><td><span class="pl ${p[0]}">${p[1]}</span></td><td><button class="gh sm" data-act="open" data-id="${q.id}">Mở</button></td></tr>`}).join('')}</tbody></table></div></div></section>
 <div class="strip"><span>Bash</span><span>Tcl</span><span>awk</span><span>Synopsys DC</span><span>PrimeTime</span><span>Innovus</span><span>Vivado</span></div>
 <h2 class="sh">Học theo phần</h2><p class="sub">Chọn một phần để làm riêng, tiến độ từng phần cập nhật ngay.</p><div class="bento">${bento}</div>
 <div class="cta panel"><div><b>Sẵn sàng thi chưa?</b><span>Làm tiếp các câu chưa làm, câu sai sẽ tự được đánh dấu để ôn lại.</span></div><button class="pri" data-act="start" data-f="new">Làm tiếp</button></div>`;
 $('#list').innerHTML=P[0].sections.slice(1).map((x,i)=>`<details class="ref" ${i?'open':''}><summary>${esc(x.title)}</summary>${blocks(x.blocks)}</details>`).join('');$('#pg').innerHTML=''}
function doc(){const s=P[V.pi].sections[V.si];$('#bar').innerHTML=`<h2>${esc(s.title==='Tổng quan'?P[V.pi].title:s.title)}</h2>`;$('#list').innerHTML=blocks(s.blocks);$('#pg').innerHTML=''}
function render(){nav();stats();if(V.q||['all','part','sec'].includes(V.scope))quiz();else if(V.scope==='doc')doc();else home();window.scrollTo(0,0)}
function upd(q){const el=document.getElementById('q'+q.id);if(el)el.outerHTML=card(q);bar();pager();nav();stats()}
function pick(id,k){const q=QM[id];if(V.picked[id]!=null)return;V.picked[id]=k;const ok=k===q.ans[0];S.res[id]={ok};const dk=dkey(new Date());S.days[dk]=(S.days[dk]||0)+1;if(!ok&&S.auto)S.marks[id]=1;save();upd(q)}
function star(id){S.marks[id]=S.marks[id]?0:1;if(!S.marks[id])delete S.marks[id];save();upd(QM[id])}
function go(d){const i=V.idx+d;if(i<0||i>=L.length)return;V.idx=i;draw();window.scrollTo(0,0)}
function goto(el){V.q='';$('#search').value='';V.f='all';V.idx=0;V.seed=0;V.conf=0;V.scope=el.dataset.go;V.pi=+el.dataset.p||0;V.si=+el.dataset.s||0;if(V.pi)V.openP[V.pi]=true;$('#nav').classList.remove('open');render()}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]'),g=e.target.closest('[data-go]');
 if(g&&!b)return goto(g);
 if(!b)return;const a=b.dataset.act,id=+b.dataset.id;
 if(a==='pick')pick(id,b.dataset.k);
 else if(a==='show'){V.shown[id]=1;upd(QM[id])}
 else if(a==='star')star(id);
 else if(a==='next')go(1);else if(a==='prev')go(-1);
 else if(a==='jump'){V.idx=+b.dataset.i;draw();window.scrollTo(0,0)}
 else if(a==='f'){V.f=b.dataset.f;V.idx=0;quiz()}
 else if(a==='mode'){V.mode=b.dataset.m;bar();draw()}
 else if(a==='shuf'){S.shuf=!S.shuf;V.perm={};save();quiz()}
 else if(a==='auto'){S.auto=!S.auto;save();bar()}
 else if(a==='order'){V.seed=rs();V.idx=0;quiz()}
 else if(a==='reset'){if(V.conf!==1){V.conf=1;return bar()}V.conf=0;baseQs().forEach(q=>{delete S.res[q.id];delete V.picked[q.id];delete V.shown[q.id]});save();render()}
 else if(a==='wipe'){if(V.conf!==2){V.conf=2;return nav()}V.conf=0;S.res={};S.marks={};V.picked={};V.shown={};save();render()}
 else if(a==='start'){V.q='';$('#search').value='';V.scope='all';V.f=b.dataset.f;V.idx=0;V.seed=0;V.mode='one';$('#nav').classList.remove('open');render()}
 else if(a==='open'){V.q='';V.scope='all';V.f='all';V.seed=0;V.mode='one';V.idx=Qs.findIndex(q=>q.id===id);render()}
 else if(a==='tp'){const i=+b.dataset.p,cur=V.openP[i]!==undefined?V.openP[i]:(V.pi===i&&['part','sec','doc'].includes(V.scope)&&!V.q);V.openP[i]=!cur;nav()}
 else if(a==='copy'){const t=b.nextElementSibling.textContent,ok=()=>{b.textContent='Đã chép';setTimeout(()=>b.textContent='Chép',1200)};
  try{navigator.clipboard.writeText(t).then(ok,()=>{})}catch(x){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(y){}ta.remove()}}
});
$('#search').addEventListener('input',e=>{V.q=e.target.value.trim();V.idx=0;V.f='all';render()});
$('#menu').addEventListener('click',()=>$('#nav').classList.toggle('open'));
function theme(){document.documentElement.dataset.theme=S.theme==='light'?'light':'dark';$('#theme').textContent=S.theme==='light'?'Nền sáng':'Nền tối'}
$('#theme').addEventListener('click',()=>{S.theme=S.theme==='light'?'dark':'light';save();theme()});
document.addEventListener('keydown',e=>{
 if(e.target.matches('input,textarea')||e.metaKey||e.ctrlKey||e.altKey||V.mode!=='one'||!L.length||!(V.q||['all','part','sec'].includes(V.scope)))return;
 const q=L[V.idx],k=e.key.toLowerCase(),i='abcd'.indexOf(k)>=0?'abcd'.indexOf(k):'1234'.indexOf(k);
 if(k.length===1&&i>=0){const o=perm(q)[i];if(o)pick(q.id,o.k)}
 else if(k==='arrowright')go(1);else if(k==='arrowleft')go(-1);
 else if(k==='enter'&&(V.picked[q.id]!=null||V.shown[q.id]))go(1);
 else if(k==='s')star(q.id)});
theme();render();
</script>
</body>
</html>
