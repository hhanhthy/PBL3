ng. Đây là lỗi rất hay gặp khi chép code từ tài liệu.", "expcode": []}]}, {"title": "D4. monitor.sh và system_monitor.sh (Bài tập 04/09)", "blocks": [], "questions": [{"id": 107, "q": "Trong \u0001top -bn1\u0002, cờ \u0001-b\u0002 và \u0001-n1\u0002 nghĩa là?", "code": [], "opts": [{"k": "A", "v": "batch mode (không tương tác, để dùng trong script), chạy 1 lần"}, {"k": "B", "v": "background, chạy 1 tiến trình"}, {"k": "C", "v": "bottom, 1 dòng"}, {"k": "D", "v": "binary, 1 byte"}], "ans": ["A"], "exp": "Mặc định \u0001top\u0002 chạy liên tục và tương tác nên không dùng được trong pipe.", "expcode": []}, {"id": 108, "q": "\u0001... | awk '{print $2}' | cut -d'%' -f1\u0002 làm gì?", "code": [], "opts": [{"k": "A", "v": "In cột 2 của dòng rồi lấy phần trước dấu \u0001%\u0002 đầu tiên"}, {"k": "B", "v": "Xóa dấu %"}, {"k": "C", "v": "Đếm số dấu %"}, {"k": "D", "v": "In cột 1 rồi cột 2"}], "ans": ["A"], "exp": "\u0001-d'%'\u0002 đặt \u0001%\u0002 làm ký tự phân tách, \u0001-f1\u0002 chọn trường 1. Pipe \u0001|\u0002 nối đầu ra lệnh này vào đầu vào lệnh sau.", "expcode": []}, {"id": 109, "q": "\u0001free | grep Mem | awk '{print ($3/$2) * 100.0}'\u0002 tính gì?", "code": [], "opts": [{"k": "A", "v": "Phần trăm RAM đang dùng (used / total × 100)"}, {"k": "B", "v": "Phần trăm RAM còn trống"}, {"k": "C", "v": "Tổng RAM"}, {"k": "D", "v": "Dung lượng swap"}], "ans": ["A"], "exp": "Trên dòng \u0001Mem:\u0002: $2 = total, $3 = used.", "expcode": []}, {"id": 110, "q": "\u0001df -h / | tail -1 | awk '{print $5}' | cut -d'%' -f1\u0002 cho kết quả?", "code": [], "opts": [{"k": "A", "v": "Tên phân vùng"}, {"k": "B", "v": "Phần trăm đĩa đã dùng của \u0001/\u0002 (ví dụ 45) "}, {"k": "C", "v": "Dung lượng còn trống"}, {"k": "D", "v": "Số file"}], "ans": ["B"], "exp": "\u0001tail -1\u0002 bỏ dòng tiêu đề, cột 5 là \u0001Use%\u0002 (ví dụ 45%), \u0001cut\u0002 bỏ dấu %.", "expcode": []}, {"id": 111, "q": "Vì sao script dùng \u0001(( $(echo \"$CPU_USAGE > $THRESHOLD_CPU\" | bc -l) ))\u0002 thay vì so sánh trực tiếp?", "code": [], "opts": [{"k": "A", "v": "Vì \u0001(( ))\u0002 chỉ tính số nguyên, không so sánh số thực; \u0001bc -l\u0002 tính số thực và in 1 (đúng) hoặc 0 (sai)"}, {"k": "B", "v": "Vì \u0001bc\u0002 chạy nhanh hơn"}, {"k": "C", "v": "Vì \u0001if\u0002 không dùng được \u0001>\u0002"}, {"k": "D", "v": "Vì CPU_USAGE là chuỗi chữ"}], "ans": ["A"], "exp": "Ví dụ CPU 85.3 so với 80: \u0001echo \"85.3 > 80\" | bc -l\u0002 in 1 (đã thử).", "expcode": []}, {"id": 112, "q": "Dấu \u0001\\\u0002 ở cuối dòng \u0001echo \"...\" \\\u0002 rồi \u0001>> \"$LOG_FILE\"\u0002 ở dòng sau có tác dụng gì?", "code": [], "opts": [{"k": "A", "v": "Comment"}, {"k": "B", "v": "Nối dòng: lệnh tiếp tục ở dòng kế tiếp"}, {"k": "C", "v": "Xóa dòng"}, {"k": "D", "v": "Kết thúc lệnh"}], "ans": ["B"], "exp": "Không được có ký tự nào (kể cả dấu cách) sau \u0001\\\u0002.", "expcode": []}, {"id": 113, "q": "Chạy script ghi vào \u0001/var/log/system_monitor.log\u0002 bằng user thường thì?", "code": [], "opts": [{"k": "A", "v": "Chạy bình thường"}, {"k": "B", "v": "Thường bị \u0001Permission denied\u0002 (cần sudo hoặc đổi log sang thư mục của mình)"}, {"k": "C", "v": "Tự tạo user root"}, {"k": "D", "v": "Tự đổi sang /tmp"}], "ans": ["B"], "exp": "\u0001/var/log\u0002 thuộc root. Script bài 2 đã dùng \u0001monitor.log\u0002 cạnh script.", "expcode": []}, {"id": 114, "q": "\u0001mail -s \"Alert\" admin@example.com\u0002 trong pipe \u0001echo \"WARNING...\" | mail ...\u0002 thì \u0001-s\u0002 là gì?", "code": [], "opts": [{"k": "A", "v": "Subject (tiêu đề thư), nội dung thư lấy từ stdin (kết quả của echo)"}, {"k": "B", "v": "Silent"}, {"k": "C", "v": "Send now"}, {"k": "D", "v": "Server"}], "ans": ["A"], "exp": "Cần mail agent đã cấu hình thì mới gửi được.", "expcode": []}, {"id": 115, "q": "Lệnh nào hiển thị 5 process dùng CPU nhiều nhất (kèm dòng tiêu đề)?", "code": [], "opts": [{"k": "A", "v": "ps aux --sort=-%cpu | head -6"}, {"k": "B", "v": "ps aux --sort=%cpu | head -5"}, {"k": "C", "v": "top | tail -5"}, {"k": "D", "v": "ps aux | wc -5"}], "ans": ["A"], "exp": "\u0001--sort=-%cpu\u0002 sắp giảm dần; \u0001head -6\u0002 = 1 dòng tiêu đề + 5 process. Dùng \u0001-%mem\u0002 để xếp theo RAM.", "expcode": []}, {"id": 116, "q": "Cách đọc ngưỡng từ \u0001monitor.conf\u0002 (chứa \u0001CPU_THRESHOLD=80\u0002) vào script là?", "code": [], "opts": [{"k": "A", "v": "\u0001source monitor.conf\u0002 (hoặc \u0001. monitor.conf\u0002)"}, {"k": "B", "v": "\u0001cat monitor.conf\u0002"}, {"k": "C", "v": "\u0001echo monitor.conf\u0002"}, {"k": "D", "v": "\u0001exit monitor.conf\u0002"}], "ans": ["A"], "exp": "\u0001source\u0002 chạy file trong shell hiện tại nên các biến được định nghĩa ngay trong script. Còn các option \u0001--cpu\u0002, \u0001--disk\u0002... xử lý bằng \u0001case \"$1\" in ... esac\u0002.", "expcode": []}]}, {"title": "D5. awk (Bài tập 2 ngày 28/08)", "blocks": [], "questions": [{"id": 117, "q": "awk hoạt động theo mô hình nào?", "code": [], "opts": [{"k": "A", "v": "Đọc từng dòng, tách thành cột ($1, $2, ...), áp dụng \u0001pattern { action }\u0002"}, {"k": "B", "v": "Biên dịch C"}, {"k": "C", "v": "Chỉ đọc cả file một lần"}, {"k": "D", "v": "Chỉ dùng cho số"}], "ans": ["A"], "exp": "awk rất mạnh cho dữ liệu dạng cột: log, bảng số liệu, output của \u0001ps\u0002, \u0001df\u0002, \u0001free\u0002.", "expcode": [], "ns": 1}, {"id": 118, "q": "Trong awk, \u0001NR\u0002, \u0001NF\u0002, \u0001$0\u0002, \u0001$NF\u0002 lần lượt là?", "code": [], "opts": [{"k": "A", "v": "Số thứ tự dòng đang xử lý; số cột của dòng; cả dòng; cột cuối"}, {"k": "B", "v": "Số cột; số dòng; cột đầu; cả dòng"}, {"k": "C", "v": "Số file; số từ; cả dòng; cột đầu"}, {"k": "D", "v": "Tên file; số dòng; cột cuối; cột 0"}], "ans": ["A"], "exp": "Đã thử: \u0001echo \"a b c\" | awk '{print $NF, NF}'\u0002 in \u0001c 3\u0002.", "expcode": [], "ns": 1}, {"id": 119, "q": "\u0001awk -F: '{print $1}' /etc/passwd\u0002 làm gì?", "code": [], "opts": [{"k": "A", "v": "In cột 1 (tên user) của mỗi dòng, dùng \u0001:\u0002 làm dấu phân cách"}, {"k": "B", "v": "In dòng chứa dấu :"}, {"k": "C", "v": "Xóa dấu :"}, {"k": "D", "v": "Đếm dấu :"}], "ans": ["A"], "exp": "\u0001-F\u0002 đặt ký tự phân tách trường (mặc định là khoảng trắng).", "expcode": []}, {"id": 120, "q": "\u0001awk 'BEGIN{s=0} {s+=$2} END{print s}' data.txt\u0002 in?", "code": [], "opts": [{"k": "A", "v": "Tổng cột 2 của cả file"}, {"k": "B", "v": "Dòng đầu tiên"}, {"k": "C", "v": "Số dòng"}, {"k": "D", "v": "Cột 2 của dòng cuối"}], "ans": ["A"], "exp": "\u0001BEGIN\u0002 chạy một lần trước khi đọc dòng nào; \u0001END\u0002 chạy một lần sau khi đọc hết file.", "expcode": [], "ns": 1}, {"id": 121, "q": "\u0001awk '$3 > 50 {print $1}' scores.txt\u0002 làm gì?", "code": [], "opts": [{"k": "A", "v": "In cột 1 của các dòng có cột 3 lớn hơn 50"}, {"k": "B", "v": "In mọi dòng"}, {"k": "C", "v": "In cột 3"}, {"k": "D", "v": "Lỗi"}], "ans": ["A"], "exp": "Phần trước \u0001{}\u0002 là pattern (điều kiện); không có pattern thì action áp dụng cho mọi dòng.", "expcode": []}, {"id": 122, "q": "Khi viết \u0001awk '{print $2}'\u0002 trong script, vì sao nên đặt trong nháy đơn?", "code": [], "opts": [{"k": "A", "v": "Để Bash không tự thay \u0001$2\u0002 mà để nguyên cho awk xử lý"}, {"k": "B", "v": "Để chạy nhanh hơn"}, {"k": "C", "v": "Vì awk bắt buộc"}, {"k": "D", "v": "Để in màu"}], "ans": ["A"], "exp": "Trong nháy đơn, Bash không thay \u0001$\u0002. Đây cũng là lý do \u0001echo '...$name...' >> run.tcl\u0002 dùng nháy đơn.", "expcode": []}]}, {"title": "D6. Hàm Bash (Bài 7, 8)", "blocks": [], "questions": [{"id": 123, "q": "Đoạn code in ra gì?", "code": ["tinh_tong() {", "    local a=$1", "    local b=$2", "    local ket_qua=$((a+b))", "    echo \"$ket_qua\"", "}", "tong=$(tinh_tong 15 20)", "echo \"Tong la: $tong\""], "opts": [{"k": "A", "v": "35"}, {"k": "B", "v": "Tong la: 35"}, {"k": "C", "v": "Tong la: 1520"}, {"k": "D", "v": "Tong la: (rỗng)"}], "ans": ["B"], "exp": "\u0001$(tinh_tong 15 20)\u0002 lấy output của hàm (do \u0001echo\u0002 in ra) gán cho \u0001tong\u0002. \u0001$((a+b))\u0002 tính số học nên 15+20 = 35.", "expcode": []}, {"id": 124, "q": "Vì sao hàm Bash trả giá trị bằng \u0001echo\u0002 rồi lấy bằng \u0001$(...)\u0002 thay vì \u0001return\u0002?", "code": [], "opts": [{"k": "A", "v": "\u0001return\u0002 chỉ trả mã trạng thái 0–255, không dùng để trả dữ liệu"}, {"k": "B", "v": "\u0001return\u0002 bị cấm"}, {"k": "C", "v": "\u0001echo\u0002 nhanh hơn"}, {"k": "D", "v": "\u0001return\u0002 chỉ dùng trong Tcl"}], "ans": ["A"], "exp": "Muốn trả chuỗi hoặc số lớn: \u0001echo\u0002 trong hàm, bên ngoài dùng \u0001x=$(ham ...)\u0002.", "expcode": []}, {"id": 125, "q": "Từ khóa \u0001local\u0002 trong hàm Bash có tác dụng gì?", "code": [], "opts": [{"k": "A", "v": "Biến chỉ tồn tại trong hàm, không đè lên biến cùng tên bên ngoài"}, {"k": "B", "v": "Biến là hằng số"}, {"k": "C", "v": "Biến chia sẻ giữa các script"}, {"k": "D", "v": "Xuất biến ra môi trường"}], "ans": ["A"], "exp": "Giống biến local trong proc Tcl.", "expcode": []}, {"id": 126, "q": "Hàm \u0001in_thong_tin() { echo \"Tham so 1: $1, Tham so 2: $2\"; }\u0002 được gọi bằng \u0001in_thong_tin \"Hello\" \"AnhThy\"\u0002. In ra?", "code": [], "opts": [{"k": "A", "v": "Tham so 1: Hello, Tham so 2: AnhThy"}, {"k": "B", "v": "Tham so 1: , Tham so 2: "}, {"k": "C", "v": "Tham so 1: $1, Tham so 2: $2"}, {"k": "D", "v": "Lỗi"}], "ans": ["A"], "exp": "Bên trong hàm, \u0001$1\u0002, \u0001$2\u0002 là tham số của lời gọi hàm, không phải của script.", "expcode": []}, {"id": 127, "q": "Nếu gõ nhầm \u0001echo\"$ket_qua\"\u0002 (thiếu dấu cách sau echo) thì?", "code": [], "opts": [{"k": "A", "v": "Vẫn in bình thường"}, {"k": "B", "v": "Lỗi \u0001command not found\u0002 (Bash đọc thành một từ, ví dụ \u0001echo35\u0002)"}, {"k": "C", "v": "In echo rồi giá trị"}, {"k": "D", "v": "In rỗng"}], "ans": ["B"], "exp": "Đã thử với \u0001echo\"hi\"\u0002: báo \u0001echohi: command not found\u0002.", "expcode": []}]}, {"title": "D7. Tcl: nhập dữ liệu, if và list (Bài tập 11/09, Tcl Bài 4)", "blocks": [], "questions": [{"id": 128, "q": "Cách đọc một số từ bàn phím trong Tcl?", "code": [], "opts": [{"k": "A", "v": "\u0001gets stdin num\u0002"}, {"k": "B", "v": "\u0001read num\u0002"}, {"k": "C", "v": "\u0001input num\u0002"}, {"k": "D", "v": "\u0001scanf num\u0002"}], "ans": ["A"], "exp": "\u0001gets stdin biến\u0002 đọc một dòng từ bàn phím vào biến. Rồi dùng \u0001if {$num > 0} ... elseif {$num < 0} ... else ...\u0002 để phân loại dương, âm, bằng 0.", "expcode": []}, {"id": 129, "q": "Đề: kiểm tra phần tử cuối của list \u0001scores\u0002 bằng 10 hay không. Dòng nào đúng?", "code": [], "opts": [{"k": "A", "v": "\u0001if {[lindex $scores end] == 10} { ... }\u0002"}, {"k": "B", "v": "\u0001if {lindex $scores end == 10} { ... }\u0002"}, {"k": "C", "v": "\u0001if {$scores(end) == 10} { ... }\u0002"}, {"k": "D", "v": "\u0001if [lindex $scores end] = 10 { ... }\u0002"}], "ans": ["A"], "exp": "Lệnh con phải đặt trong \u0001[ ]\u0002; so sánh số dùng \u0001==\u0002. \u0001$scores(end)\u0002 là cú pháp của array, không phải list.", "expcode": []}, {"id": 130, "q": "Sau khi chạy hai dòng này, \u0001llength $danh_sach\u0002 bằng?", "code": ["set danh_sach [list \"Apple\" \"Banana\" \"Cherry\" \"Durian\"]", "set danh_sach_moi [lappend danh_sach \"Elderberry\"]"], "opts": [{"k": "A", "v": "4"}, {"k": "B", "v": "5"}, {"k": "C", "v": "1"}, {"k": "D", "v": "Lỗi"}], "ans": ["B"], "exp": "\u0001lappend\u0002 nhận TÊN biến (không có \u0001$\u0002) và sửa trực tiếp biến đó, đồng thời trả về list mới. Đã thử: cả \u0001danh_sach\u0002 và \u0001danh_sach_moi\u0002 đều thành Apple Banana Cherry ... Elderberry.", "expcode": []}, {"id": 131, "q": "Với list như câu trước, vòng \u0001foreach trai_cay $danh_sach {...}\u0002 chạy bao nhiêu lần?", "code": [], "opts": [{"k": "A", "v": "4"}, {"k": "B", "v": "5"}, {"k": "C", "v": "1"}, {"k": "D", "v": "6"}], "ans": ["B"], "exp": "Vì \u0001danh_sach\u0002 đã bị \u0001lappend\u0002 sửa thành 5 phần tử trước khi vòng lặp chạy.", "expcode": []}, {"id": 132, "q": "Ban đầu list có 4 phần tử. \u0001llength\u0002 và \u0001lindex $danh_sach 1\u0002 lần lượt cho?", "code": [], "opts": [{"k": "A", "v": "4 và Banana"}, {"k": "B", "v": "4 và Apple"}, {"k": "C", "v": "3 và Banana"}, {"k": "D", "v": "5 và Cherry"}], "ans": ["A"], "exp": "Chỉ số bắt đầu từ 0 nên chỉ số 1 là phần tử thứ hai: Banana.", "expcode": []}, {"id": 133, "q": "Gõ \u0001lappend $danh_sach \"X\"\u0002 (có \u0001$\u0002) thì?", "code": [], "opts": [{"k": "A", "v": "Thêm X vào danh_sach"}, {"k": "B", "v": "Không sửa danh_sach; Tcl lấy nội dung list làm TÊN một biến khác và thêm X vào đó"}, {"k": "C", "v": "Lỗi cú pháp"}, {"k": "D", "v": "Xóa danh_sach"}], "ans": ["B"], "exp": "Đã thử: danh_sach giữ nguyên. Lỗi kinh điển: \u0001lappend\u0002 cần tên biến, không phải giá trị.", "expcode": []}]}, {"title": "D8. Tcl: đọc file config bằng dict (Bài tập 18/09)", "blocks": [], "questions": [{"id": 134, "q": "Đoạn code này in ra gì?", "code": ["set config [dict create]", "dict set config width 100", "puts [dict get $config width]"], "opts": [{"k": "A", "v": "100"}, {"k": "B", "v": "width"}, {"k": "C", "v": "{width 100}"}, {"k": "D", "v": "Lỗi"}], "ans": ["A"], "exp": "\u0001dict\u0002 là cấu trúc key-value (từ điển): \u0001dict set\u0002 thêm/sửa, \u0001dict get\u0002 lấy giá trị.", "expcode": []}, {"id": 135, "q": "Với điều kiện \u0001if {[string match \"#*\" $line] || $line eq \"\"} { continue }\u0002, dòng nào KHÔNG bị bỏ qua?", "code": [], "opts": [{"k": "A", "v": "\u0001# Dimensions\u0002"}, {"k": "B", "v": "Dòng trống"}, {"k": "C", "v": "\u0001width = 100\u0002"}, {"k": "D", "v": "\u0001# settings.cfg\u0002"}], "ans": ["C"], "exp": "Bỏ qua comment (bắt đầu bằng \u0001#\u0002) và dòng trống. \u0001eq\u0002 so sánh chuỗi; \u0001==\u0002 so sánh số.", "expcode": []}, {"id": 136, "q": "Với \u0001regexp {(\\w+)\\s*=\\s*(.+)} \"frequency = 100MHz\" -> key value\u0002, biến \u0001value\u0002 bằng?", "code": [], "opts": [{"k": "A", "v": "100MHz"}, {"k": "B", "v": "100"}, {"k": "C", "v": "= 100MHz"}, {"k": "D", "v": "frequency"}], "ans": ["A"], "exp": "\u0001->\u0002 nhận toàn bộ phần khớp; \u0001key\u0002 = nhóm 1 (frequency); \u0001value\u0002 = nhóm 2 (100MHz). Giá trị vẫn là chuỗi.", "expcode": []}, {"id": 137, "q": "Vì sao có \u0001string trim $value\u0002 trước khi \u0001dict set\u0002?", "code": [], "opts": [{"k": "A", "v": "Để bỏ khoảng trắng thừa ở hai đầu giá trị (\u0001.+\u0002 có thể lấy cả khoảng trắng cuối dòng)"}, {"k": "B", "v": "Để chuyển chữ hoa thành chữ thường"}, {"k": "C", "v": "Để xóa dấu \u0001=\u0002"}, {"k": "D", "v": "Để đổi sang số"}], "ans": ["A"], "exp": "Cùng lý do khi đọc file config thực tế thường có khoảng trắng thừa.", "expcode": [], "ns": 1}, {"id": 138, "q": "Với file settings.cfg (width = 100, height = 50), \u0001calculate\u0002 in ra?", "code": [], "opts": [{"k": "A", "v": "Width: 100 / Height: 50 / Area: 5000"}, {"k": "B", "v": "Width: 100 / Height: 50 / Area: 150"}, {"k": "C", "v": "Area: 5000 only"}, {"k": "D", "v": "Lỗi vì giá trị là chuỗi"}], "ans": ["A"], "exp": "Tcl tự hiểu chuỗi số trong \u0001expr\u0002: 100 × 50 = 5000. (Nhưng nếu giá trị là \u0001100MHz\u0002 thì \u0001expr\u0002 lỗi vì không phải số.)", "expcode": []}, {"id": 139, "q": "Nếu file cfg thiếu key \u0001height\u0002, \u0001dict get $config height\u0002 sẽ?", "code": [], "opts": [{"k": "A", "v": "Trả 0"}, {"k": "B", "v": "Trả chuỗi rỗng"}, {"k": "C", "v": "Báo lỗi \u0001key \"height\" not known in dictionary\u0002"}, {"k": "D", "v": "Tự tạo key"}], "ans": ["C"], "exp": "Phòng tránh: kiểm tra \u0001dict exists $config height\u0002 trước, hoặc bọc \u0001catch\u0002. Đã thử trong sandbox.", "expcode": []}]}, {"title": "D9. Tcl Bài 7: proc và tham số", "blocks": [], "questions": [{"id": 140, "q": "Gọi \u0001greet \"Thy\"\u0002 rồi \u0001greet \"Thy\" \"Xin chao\"\u0002 với \u0001proc greet {name {msg \"Hello\"}} {puts \"$msg, $name!\"}\u0002 in ra?", "code": [], "opts": [{"k": "A", "v": "Hello, Thy! và Xin chao, Thy!"}, {"k": "B", "v": "Thy, Hello! và Thy, Xin chao!"}, {"k": "C", "v": "Lỗi vì thiếu tham số"}, {"k": "D", "v": "Hello, Thy! hai lần"}], "ans": ["A"], "exp": "Tham số có giá trị mặc định đặt trong cặp braces \u0001{msg \"Hello\"}\u0002; khi không truyền thì dùng mặc định.", "expcode": []}, {"id": 141, "q": "\u0001proc sum_all {args}\u0002: \u0001sum_all 1 2 3 4 5\u0002 và \u0001sum_all\u0002 (không tham số) lần lượt trả về?", "code": [], "opts": [{"k": "A", "v": "15 và 0"}, {"k": "B", "v": "15 và lỗi"}, {"k": "C", "v": "5 và 0"}, {"k": "D", "v": "1 và 0"}], "ans": ["A"], "exp": "\u0001args\u0002 là tên đặc biệt: gom mọi tham số còn lại thành một list (rỗng nếu không có). Vòng \u0001foreach n $args\u0002 cộng dồn, tổng ban đầu 0.", "expcode": []}, {"id": 142, "q": "Tham số đặc biệt \u0001args\u0002 phải đặt ở đâu trong danh sách tham số của proc?", "code": [], "opts": [{"k": "A", "v": "Cuối danh sách"}, {"k": "B", "v": "Đầu danh sách"}, {"k": "C", "v": "Ở giữa"}, {"k": "D", "v": "Ở đâu cũng được"}], "ans": ["A"], "exp": "Ví dụ \u0001proc f {a b args}\u0002.", "expcode": []}, {"id": 143, "q": "\u0001rect_area 4 5\u0002 (proc tính diện tích, in \u0001Area of $width x $height = $area\u0002) in ra?", "code": [], "opts": [{"k": "A", "v": "Area of 4 x 5 = 20"}, {"k": "B", "v": "Area of $width x $height = $area"}, {"k": "C", "v": "20"}, {"k": "D", "v": "Area of 4 x 5 = 9"}], "ans": ["A"], "exp": "Trong chuỗi \u0001\"\"\u0002 các biến được thay giá trị.", "expcode": []}, {"id": 144, "q": "Khi tạo run.tcl bằng terminal, vì sao viết \u0001echo 'proc greet {name {msg \"Hello\"}} {puts \"$msg, $name!\"}' >> run.tcl\u0002 bằng nháy đơn?", "code": [], "opts": [{"k": "A", "v": "Nháy kép của Bash sẽ thay \u0001$msg\u0002, \u0001$name\u0002 (thành rỗng) trước khi ghi file; nháy đơn giữ nguyên"}, {"k": "B", "v": "Vì Tcl yêu cầu"}, {"k": "C", "v": "Để file chạy nhanh hơn"}, {"k": "D", "v": "Không có lý do"}], "ans": ["A"], "exp": "Đây là cách hai thế giới Bash và Tcl gặp nhau: mỗi nơi có quy tắc substitution riêng.", "expcode": []}, {"id": 145, "q": "Một proc không có lệnh \u0001return\u0002 thì trả về gì?", "code": [], "opts": [{"k": "A", "v": "Kết quả của lệnh cuối cùng trong body"}, {"k": "B", "v": "Luôn là 0"}, {"k": "C", "v": "Luôn là chuỗi rỗng"}, {"k": "D", "v": "Lỗi"}], "ans": ["A"], "exp": "Khi cần rõ ràng, dùng \u0001return\u0002 như \u0001add\u0002 trong bài lab: \u0001return [expr {$a + $b}]\u0002.", "expcode": []}]}, {"title": "D10. Tcl Bài 13: switch", "blocks": [], "questions": [{"id": 146, "q": "Với \u0001check_grade\u0002 dùng \u0001switch -- [expr {int($score / 10)}]\u0002, kết quả của \u0001check_grade 85\u0002, \u0001check_grade 100\u0002, \u0001check_grade 55\u0002 lần lượt?", "code": ["proc check_grade {score} {", "    switch -- [expr {int($score / 10)}] {", "        10 -", "        9  { return \"A\" }", "        8  { return \"B\" }", "        7  { return \"C\" }", "        6  { return \"D\" }", "        default { return \"F\" }", "    }", "}"], "opts": [{"k": "A", "v": "B, A, F"}, {"k": "B", "v": "B, B, F"}, {"k": "C", "v": "A, A, D"}, {"k": "D", "v": "B, A, D"}], "ans": ["A"], "exp": "85 → 8 → B. 100 → 10 → rơi qua nhờ \u000110 -\u0002 xuống nhánh 9 → A. 55 → 5 không có nhánh → default F. Đã chạy thử.", "expcode": []}, {"id": 147, "q": "Tùy chọn \u0001--\u0002 trong \u0001switch -- $x {...}\u0002 dùng để làm gì?", "code": [], "opts": [{"k": "A", "v": "Kết thúc phần tùy chọn, để giá trị bắt đầu bằng \u0001-\u0002 không bị hiểu là option"}, {"k": "B", "v": "Chỉ so sánh số"}, {"k": "C", "v": "Bật regexp"}, {"k": "D", "v": "Bỏ qua default"}], "ans": ["A"], "exp": "Thói quen an toàn khi giá trị đem so sánh có thể là chuỗi tùy ý.", "expcode": []}, {"id": 148, "q": "\u0001run_cmd \"pause\"\u0002 với \u0001switch $cmd {\"start\" {...} \"stop\" {...} default {puts \"Unknown command: $cmd\"}}\u0002 in ra?", "code": [], "opts": [{"k": "A", "v": "Unknown command: pause"}, {"k": "B", "v": "Starting simulation..."}, {"k": "C", "v": "Không in gì"}, {"k": "D", "v": "Lỗi"}], "ans": ["A"], "exp": "Không khớp nhánh nào thì chạy \u0001default\u0002.", "expcode": []}, {"id": 149, "q": "Máy tính nhỏ với \u0001switch $op {\"+\" {...} \"-\" {...} \"*\" {...} default {set result 0}}\u0002. Với a=5, b=3, op=\"/\", dòng \u0001puts \"$a $op $b = $result\"\u0002 in?", "code": [], "opts": [{"k": "A", "v": "5 / 3 = 0"}, {"k": "B", "v": "5 / 3 = 1"}, {"k": "C", "v": "5 / 3 = 1.666"}, {"k": "D", "v": "Lỗi"}], "ans": ["A"], "exp": "\u0001/\u0002 không có nhánh nên chạy default: result = 0. (Chuỗi \u00015 + 3 = 8\u0002 thì nhánh \u0001\"+\"\u0002.)", "expcode": []}, {"id": 150, "q": "Trong \u0001switch $op {\"*\" {...}}\u0002 (không có \u0001-glob\u0002), pattern \u0001\"*\"\u0002 khớp với?", "code": [], "opts": [{"k": "A", "v": "Mọi chuỗi"}, {"k": "B", "v": "Chỉ chuỗi đúng bằng ký tự \u0001*\u0002"}, {"k": "C", "v": "Chuỗi rỗng"}, {"k": "D", "v": "Chỉ số"}], "ans": ["B"], "exp": "Mặc định là \u0001-exact\u0002. Muốn \u0001*\u0002 là ký tự đại diện phải dùng \u0001switch -glob\u0002. Đã thử: op=\"x\" rơi vào default.", "expcode": []}]}, {"title": "D11. Lab Chủ đề 1: Icarus, Verilator, GTKWave", "blocks": [], "questions": [{"id": 151, "q": "Quy trình mô phỏng cơ bản với Icarus Verilog?", "code": [], "opts": [{"k": "A", "v": "\u0001iverilog -o sim tb.v counter.v\u0002 rồi \u0001vvp sim\u0002"}, {"k": "B", "v": "\u0001vvp -o sim tb.v\u0002 rồi \u0001iverilog sim\u0002"}, {"k": "C", "v": "\u0001gtkwave tb.v\u0002"}, {"k": "D", "v": "\u0001verilator tb.v\u0002 rồi \u0001vvp\u0002"}], "ans": ["A"], "exp": "\u0001iverilog\u0002 biên dịch ra file mô phỏng, \u0001vvp\u0002 chạy file đó. \u0001iverilog -V\u0002 xem phiên bản.", "expcode": []}, {"id": 152, "q": "Trong testbench, \u0001$dumpfile(\"wave.vcd\"); $dumpvars(0, tb);\u0002 dùng để?", "code": [], "opts": [{"k": "A", "v": "Ghi waveform ra file VCD để xem bằng \u0001gtkwave wave.vcd\u0002"}, {"k": "B", "v": "Dừng mô phỏng"}, {"k": "C", "v": "Tạo clock"}, {"k": "D", "v": "In ra màn hình"}], "ans": ["A"], "exp": "VCD (Value Change Dump) là định dạng waveform; GTKWave là chương trình xem.", "expcode": []}, {"id": 153, "q": "Điểm khác chính giữa Verilator và Icarus Verilog?", "code": [], "opts": [{"k": "A", "v": "Verilator chuyển RTL sang C++ rồi biên dịch (nhanh khi mô phỏng lớn nhưng cần bước build); Icarus mô phỏng trực tiếp kiểu thông dịch"}, {"k": "B", "v": "Verilator chỉ dùng cho VHDL"}, {"k": "C", "v": "Icarus không có waveform"}, {"k": "D", "v": "Hai công cụ giống hệt nhau"}], "ans": ["A"], "exp": "Lệnh xem phiên bản: \u0001verilator --version\u0002, \u0001iverilog -V\u0002.", "expcode": []}, {"id": 154, "q": "\u0001ghdl --version\u0002 thuộc công cụ cho ngôn ngữ nào?", "code": [], "opts": [{"k": "A", "v": "Verilog"}, {"k": "B", "v": "VHDL"}, {"k": "C", "v": "SystemC"}, {"k": "D", "v": "Tcl"}], "ans": ["B"], "exp": "GHDL là trình mô phỏng VHDL mã nguồn mở.", "expcode": []}]}, {"title": "D12. Tcl Bài 7 (phần 2) và Tcl HDL 3: glob, thống kê file", "blocks": [], "questions": [{"id": 155, "q": "Với \u0001proc chao {ten {loi \"hello\"}} {puts \"$loi, $ten\"}\u0002, lệnh \u0001chao \"AnhThy\"\u0002 và \u0001chao \"AnhThy\" \"Hello\"\u0002 lần lượt in?", "code": [], "opts": [{"k": "A", "v": "hello, AnhThy và Hello, AnhThy"}, {"k": "B", "v": "AnhThy, hello và AnhThy, Hello"}, {"k": "C", "v": "Hello, AnhThy hai lần"}, {"k": "D", "v": "Lỗi vì thiếu tham số"}], "ans": ["A"], "exp": "Không truyền \u0001loi\u0002 thì dùng mặc định \u0001hello\u0002 (chữ thường). Chú ý khác với bài trước mặc định là \u0001Hello\u0002: đọc kỹ chữ hoa/thường trong đề.", "expcode": []}, {"id": 156, "q": "Kết quả của \u0001tinh_dien_tich 14 11\u0002 và \u0001tong 10 11 12 13 14\u0002 (proc \u0001tong {args}\u0002 cộng dồn)?", "code": [], "opts": [{"k": "A", "v": "154 và 60"}, {"k": "B", "v": "25 và 60"}, {"k": "C", "v": "154 và 14"}, {"k": "D", "v": "154 và 50"}], "ans": ["A"], "exp": "14 × 11 = 154; 10 + 11 + 12 + 13 + 14 = 60. \u0001args\u0002 gom các tham số thành một list rồi \u0001foreach\u0002 cộng dồn.", "expcode": []}, {"id": 157, "q": "Lệnh \u0001echo 'proc tong {args} {...}; puts \"Tong = [tong 1 2 3 4]\"' | tclsh\u0002 hoạt động thế nào?", "code": [], "opts": [{"k": "A", "v": "Bash đưa đoạn script qua pipe, \u0001tclsh\u0002 đọc từ stdin và chạy; nháy đơn giữ nguyên \u0001$\u0002 và \u0001[ ]\u0002 cho Tcl"}, {"k": "B", "v": "Bash tự chạy đoạn Tcl"}, {"k": "C", "v": "\u0001tclsh\u0002 lưu script thành file"}, {"k": "D", "v": "Lỗi vì thiếu file .tcl"}], "ans": ["A"], "exp": "Đây là cách chạy nhanh Tcl từ terminal mà không cần tạo file. Đã thử: in \u0001Tong = 10\u0002.", "expcode": []}, {"id": 158, "q": "\u0001glob -nocomplain *.v\u0002 trong thư mục hiện tại trả về gì?", "code": [], "opts": [{"k": "A", "v": "Danh sách các file có tên khớp \u0001*.v\u0002; nếu không có file nào thì trả danh sách rỗng, không báo lỗi"}, {"k": "B", "v": "Nội dung các file .v"}, {"k": "C", "v": "Số lượng file .v"}, {"k": "D", "v": "Chỉ file đầu tiên"}], "ans": ["A"], "exp": "\u0001glob\u0002 tìm file theo mẫu (ký tự đại diện \u0001*\u0002, \u0001?\u0002). Cờ \u0001-nocomplain\u0002 tắt lỗi khi không có file khớp.", "expcode": []}, {"id": 159, "q": "Nếu bỏ \u0001-nocomplain\u0002 và không có file nào khớp, \u0001glob *.xyz\u0002 sẽ?", "code": [], "opts": [{"k": "A", "v": "Trả danh sách rỗng"}, {"k": "B", "v": "Báo lỗi \u0001no files matched glob pattern \"*.xyz\"\u0002"}, {"k": "C", "v": "Trả 0"}, {"k": "D", "v": "Tạo file mới"}], "ans": ["B"], "exp": "Đã thử trong sandbox. Vì vậy bài lab luôn viết \u0001glob -nocomplain\u0002.", "expcode": []}, {"id": 160, "q": "Vì sao lab bọc kết quả \u0001glob\u0002 bằng \u0001lsort\u0002?", "code": [], "opts": [{"k": "A", "v": "Vì \u0001glob\u0002 không đảm bảo thứ tự kết quả (đã thử ra \u0001counter.v alu.v\u0002), \u0001lsort\u0002 cho thứ tự ổn định"}, {"k": "B", "v": "Vì glob trả chuỗi chứ không phải list"}, {"k": "C", "v": "Để loại file trùng"}, {"k": "D", "v": "Để đổi tên file"}], "ans": ["A"], "exp": "Không \u0001lsort\u0002 thì thứ tự in ra có thể khác trên máy khác.", "expcode": []}, {"id": 161, "q": "Dòng \u0001foreach f {alu.v counter.v top.sv fifo.vhd} {close [open $f w]}\u0002 làm gì?", "code": [], "opts": [{"k": "A", "v": "Tạo 4 file rỗng (\u0001open ... w\u0002 tạo file, \u0001close\u0002 đóng ngay), giống \u0001touch\u0002"}, {"k": "B", "v": "Đọc 4 file"}, {"k": "C", "v": "Xóa 4 file"}, {"k": "D", "v": "Báo lỗi vì không ghi gì"}], "ans": ["A"], "exp": "Mode \u0001w\u0002 tạo mới (hoặc xóa nội dung nếu file đã có).", "expcode": []}, {"id": 162, "q": "Thư mục proj có alu.v, counter.v, top.sv, fifo.vhd, readme.txt. Với vòng \u0001foreach ext {v sv vhd}\u0002 và \u0001glob *.$ext\u0002, dòng cuối \u0001Tong so file HDL\u0002 in?", "code": [], "opts": [{"k": "A", "v": "4"}, {"k": "B", "v": "5"}, {"k": "C", "v": "2"}, {"k": "D", "v": "3"}], "ans": ["A"], "exp": "\u0001.v\u0002: 2 (alu, counter), \u0001.sv\u0002: 1 (top), \u0001.vhd\u0002: 1 (fifo) = 4; readme.txt không khớp. \u0001*.v\u0002 không khớp \u0001top.sv\u0002 vì tên kết thúc bằng \u0001.sv\u0002. \u0001incr total $n\u0002 cộng thêm n vào total sau mỗi đuôi.", "expcode": []}]}, {"title": "D13. Bài tập 2 ngày 16/10: Slack Report Parser (WNS, TNS)", "blocks": [], "questions": [{"id": 163, "q": "WNS và TNS trong báo cáo STA là gì?", "code": [], "opts": [{"k": "A", "v": "WNS = slack âm tệ nhất (nhỏ nhất); TNS = tổng các slack âm"}, {"k": "B", "v": "WNS = tổng slack; TNS = slack lớn nhất"}, {"k": "C", "v": "WNS = số endpoint; TNS = số path"}, {"k": "D", "v": "Cả hai đều là slack dương lớn nhất"}], "ans": ["A"], "exp": "WNS (Worst Negative Slack) cho biết path tệ nhất; TNS (Total Negative Slack) cho biết tổng mức vi phạm. Slack âm = vi phạm timing (slack < 0).", "expcode": [], "ns": 1}, {"id": 164, "q": "Với dữ liệu: reg_a_reg[0]/D: -0.45; reg_b_reg[3]/D: 0.12; fifo_mem_reg[7]/D: -1.20. Số endpoint vi phạm, WNS và TNS (ngưỡng 0.0)?", "code": [], "opts": [{"k": "A", "v": "2, -1.20, -1.65"}, {"k": "B", "v": "2, -0.45, -1.65"}, {"k": "C", "v": "3, -1.20, -1.53"}, {"k": "D", "v": "2, -1.20, -1.20"}], "ans": ["A"], "exp": "Vi phạm: -0.45 và -1.20. WNS = -1.20. TNS = -0.45 + (-1.20) = -1.65. Slack MET (0.12) không cộng vào TNS.", "expcode": []}, {"id": 165, "q": "Với \u0001proc parse_timing_report {report_file {threshold 0.0}}\u0002, gọi \u0001parse_timing_report timing.rep\u0002 thì threshold bằng?", "code": [], "opts": [{"k": "A", "v": "0.0 (giá trị mặc định)"}, {"k": "B", "v": "Không có giá trị, lỗi"}, {"k": "C", "v": "timing.rep"}, {"k": "D", "v": "1.0"}], "ans": ["A"], "exp": "Khớp yêu cầu đề: ngưỡng mặc định 0.0.", "expcode": []}, {"id": 166, "q": "Gọi lại với threshold = 0.2 trên dữ liệu trên thì số endpoint bị liệt kê là bao nhiêu, và TNS thay đổi không?", "code": [], "opts": [{"k": "A", "v": "3 endpoint; TNS vẫn -1.65 (chỉ cộng slack âm)"}, {"k": "B", "v": "2 endpoint; TNS -1.65"}, {"k": "C", "v": "3 endpoint; TNS -1.53"}, {"k": "D", "v": "1 endpoint; TNS -1.20"}], "ans": ["A"], "exp": "0.12 < 0.2 nên path đó (đang MET nhưng sát ngưỡng) cũng được liệt kê. Đã chạy thử.", "expcode": []}, {"id": 167, "q": "Vì sao so sánh số \u0001slack < $threshold\u0002 thay vì chỉ tìm chữ \u0001VIOLATED\u0002?", "code": [], "opts": [{"k": "A", "v": "Để đổi ngưỡng linh hoạt (ví dụ bắt cả path sát ngưỡng) và đúng với yêu cầu “slack < threshold”"}, {"k": "B", "v": "Vì Tcl không so sánh được chuỗi"}, {"k": "C", "v": "Vì chữ VIOLATED không có trong file"}, {"k": "D", "v": "Không có lý do"}], "ans": ["A"], "exp": "Đề: “lọc các path có slack < threshold”, hoặc mẫu dữ liệu tương đương.", "expcode": [], "ns": 1}, {"id": 168, "q": "Với dòng \u0001slack (MET)                     0.12\u0002, lệnh \u0001regexp {^slack \\((\\w+)\\)\\s+(-?[0-9.]+)} $line -> status slack\u0002 gán?", "code": [], "opts": [{"k": "A", "v": "status = MET, slack = 0.12"}, {"k": "B", "v": "status = slack, slack = MET"}, {"k": "C", "v": "status = 0.12, slack = MET"}, {"k": "D", "v": "Không khớp"}], "ans": ["A"], "exp": "\u0001\\(\u0002 \u0001\\)\u0002 là dấu ngoặc đúng nghĩa; \u0001(\\w+)\u0002 bắt chữ MET; \u0001\\s+\u0002 khoảng trắng; \u0001(-?[0-9.]+)\u0002 bắt số, cho phép dấu \u0001-\u0002.", "expcode": []}, {"id": 169, "q": "Vì sao proc lưu tên endpoint khi gặp dòng \u0001Endpoint: ...\u0002 (biến \u0001endpoint\u0002)?", "code": [], "opts": [{"k": "A", "v": "Vì dòng slack nằm sau và không chứa tên endpoint; cần nhớ tên để liệt kê path vi phạm"}, {"k": "B", "v": "Để tính TNS"}, {"k": "C", "v": "Để mở file"}, {"k": "D", "v": "Để đóng file"}], "ans": ["A"], "exp": "Parser đọc từng dòng nên phải giữ “trạng thái” (endpoint hiện tại) giữa các dòng.", "expcode": []}, {"id": 170, "q": "Nếu không có path nào vi phạm (ngưỡng 0.0), proc khởi tạo \u0001wns 0.0\u0002, \u0001tns 0.0\u0002 sẽ in?", "code": [], "opts": [{"k": "A", "v": "WNS 0.00 và TNS 0.00, kết quả PASS"}, {"k": "B", "v": "Lỗi chia cho 0"}, {"k": "C", "v": "WNS rỗng"}, {"k": "D", "v": "WNS -1.20"}], "ans": ["A"], "exp": "Giá trị khởi tạo không đổi vì không có slack nào nhỏ hơn 0.", "expcode": []}, {"id": 171, "q": "Proc kết thúc bằng \u0001return [list $count $wns $tns]\u0002. Cách tách ba giá trị ở nơi gọi?", "code": [], "opts": [{"k": "A", "v": "\u0001lassign [parse_timing_report timing.rep] n wns tns\u0002"}, {"k": "B", "v": "\u0001set n [parse_timing_report]\u0002 rồi \u0001$n(1)\u0002"}, {"k": "C", "v": "\u0001split\u0002 theo dấu phẩy"}, {"k": "D", "v": "\u0001puts\u0002 ba lần"}], "ans": ["A"], "exp": "\u0001lassign list a b c\u0002 gán lần lượt từng phần tử của list cho các biến.", "expcode": []}]}]}, {"title": "Phần E. Lab thực chiến", "sections": [{"title": "Tổng quan", "blocks": [{"t": "p", "s": "Tám bài lab làm trên máy (3 Bash, 5 Tcl), bám sát phong cách lab trên lớp. Tất cả code đã được chạy thử và kết quả bên dưới là kết quả thật. Hãy tự viết trước, bí mới xem code mẫu. Chạy Tcl bằng \u0001tclsh file.tcl\u0002."}], "questions": []}, {"title": "Lab 1 (Bash): Phân tích log mô phỏng", "blocks": [{"t": "p", "s": "Đề bài: Viết \u0001analyze_log.sh <file_log>\u0002 thống kê một log mô phỏng: kiểm tra tham số và file tồn tại, đếm tổng dòng, số ERROR, WARNING, PASS, thống kê theo mức [INFO]/[WARNING]/[ERROR] bằng awk, in các dòng ERROR kèm số dòng. Thoát mã 2 nếu có ERROR."}, {"t": "p", "s": "Kỹ năng: \u0001$1\u0002, \u0001-z\u0002, \u0001-f\u0002, \u0001grep -c\u0002, \u0001grep -n\u0002, \u0001awk -F\u0002, \u0001sort\u0002, \u0001exit\u0002"}, {"t": "p", "s": "Chuẩn bị dữ liệu mẫu (dán vào terminal):"}, {"t": "code", "lines": ["cat > sim.log << 'EOF'", "[INFO] Start simulation", "[INFO] Reset released", "[WARNING] Timeout near cycle 120", "[ERROR] Assertion failed at 340ns", "[INFO] Test adder PASS", "[ERROR] FIFO overflow at 512ns", "[WARNING] Unused signal tmp", "[INFO] Test shifter PASS", "[INFO] End simulation", "EOF"]}, {"t": "p", "s": "Code mẫu:"}, {"t": "code", "lines": ["#!/bin/bash", "# analyze_log.sh - Thong ke log mo phong", "LOG_FILE=$1", "if [ -z \"$LOG_FILE\" ]; then", "    echo \"Usage: $0 <log_file>\"", "    exit 1", "fi", "if [ ! -f \"$LOG_FILE\" ]; then", "    echo \"Error: file $LOG_FILE khong ton tai\"", "    exit 1", "fi", "echo \"=== Thong ke $LOG_FILE ===\"", "echo \"Tong so dong : $(wc -l < \"$LOG_FILE\")\"", "echo \"So ERROR     : $(grep -c '\\[ERROR\\]' \"$LOG_FILE\")\"", "echo \"So WARNING   : $(grep -c '\\[WARNING\\]' \"$LOG_FILE\")\"", "echo \"So test PASS : $(grep -c 'PASS' \"$LOG_FILE\")\"", "echo \"--- Dem theo muc do ---\"", "awk -F'[][]' '{count[$2]++} END {for (lv in count) print lv, count[lv]}' \"$LOG_FILE\" | sort", "echo \"--- Cac dong ERROR ---\"", "grep -n '\\[ERROR\\]' \"$LOG_FILE\"", "if grep -q '\\[ERROR\\]' \"$LOG_FILE\"; then", "    exit 2", "fi"]}, {"t": "p", "s": "Chạy:"}, {"t": "code", "lines": ["chmod +x analyze_log.sh && ./analyze_log.sh sim.log; echo \"exit=$?\""]}, {"t": "p", "s": "Kết quả mong đợi:"}, {"t": "code", "lines": ["=== Thong ke sim.log ===", "Tong so dong : 9", "So ERROR     : 2", "So WARNING   : 2", "So test PASS : 2", "--- Dem theo muc do ---", "ERROR 2", "INFO 5", "WARNING 2", "--- Cac dong ERROR ---", "4:[ERROR] Assertion failed at 340ns", "6:[ERROR] FIFO overflow at 512ns", "exit=2"]}, {"t": "p", "s": "Giải thích: \u0001-F'[][]'\u0002 dùng \u0001[\u0002 và \u0001]\u0002 làm dấu phân tách nên \u0001$2\u0002 là chữ giữa hai ngoặc (INFO, WARNING, ERROR). \u0001count[$2]++\u0002 là associative array của awk. \u0001grep -c '\\[ERROR\\]'\u0002 phải escape ngoặc vì \u0001[ ]\u0002 là ký tự đặc biệt của regex."}, {"t": "p", "s": "Mở rộng: thêm tùy chọn \u0001-o report.txt\u0002 để ghi kết quả ra file (dùng \u0001tee\u0002 hoặc \u0001>\u0002)."}], "questions": []}, {"title": "Lab 2 (Bash): system_monitor.sh đầy đủ (đề Bài tập 2 ngày 04/09)", "blocks": [{"t": "p", "s": "Đề bài: Giám sát CPU, RAM, Disk, load average, 5 process nặng nhất, trạng thái service, kết nối mạng. Ngưỡng đọc từ monitor.conf, cảnh báo ghi vào monitor.log, hỗ trợ \u0001--all --cpu --memory --disk --services --network\u0002."}, {"t": "p", "s": "Kỹ năng: hàm Bash, \u0001local\u0002, \u0001case\u0002, \u0001source\u0002, \u0001bc -l\u0002, \u0001ps --sort\u0002, \u0001systemctl is-active\u0002, \u0001ping -c 1\u0002, \u0001tee -a\u0002, giá trị mặc định \u0001${VAR:-80}\u0002"}, {"t": "p", "s": "Chuẩn bị dữ liệu mẫu (dán vào terminal):"}, {"t": "code", "lines": ["cat > monitor.conf << 'EOF'", "CPU_THRESHOLD=80", "MEM_THRESHOLD=80", "DISK_THRESHOLD=80", "SERVICES=\"ssh docker cron\"", "EOF"]}, {"t": "p", "s": "Code mẫu:"}, {"t": "code", "lines": ["#!/bin/bash", "# system_monitor.sh - Giam sat may chu Linux", "CONF_FILE=\"$(dirname \"$0\")/monitor.conf\"", "LOG_FILE=\"$(dirname \"$0\")/monitor.log\"", "# Doc nguong tu file cau hinh (co gia tri mac dinh neu thieu)", "[ -f \"$CONF_FILE\" ] && source \"$CONF_FILE\"", "CPU_THRESHOLD=${CPU_THRESHOLD:-80}", "MEM_THRESHOLD=${MEM_THRESHOLD:-80}", "DISK_THRESHOLD=${DISK_THRESHOLD:-80}", "SERVICES=${SERVICES:-\"ssh cron\"}", "log_alert() {", "    echo \"[$(date '+%F %T')] WARNING: $1\" | tee -a \"$LOG_FILE\"", "}", "# So sanh so thuc: thanh cong neu $1 > $2", "greater() {", "    [ \"$(echo \"$1 > $2\" | bc -l)\" -eq 1 ]", "}", "check_cpu() {", "    local cpu", "    cpu=$(top -bn1 | grep \"Cpu(s)\" | awk '{print $2}' | cut -d'%' -f1)", "    echo \"CPU : ${cpu}%\"", "    greater \"$cpu\" \"$CPU_THRESHOLD\" && log_alert \"CPU ${cpu}% > ${CPU_THRESHOLD}%\"", "}", "check_memory() {", "    local mem", "    mem=$(free | grep Mem | awk '{printf \"%.1f\", $3/$2*100}')", "    echo \"RAM : ${mem}%\"", "    greater \"$mem\" \"$MEM_THRESHOLD\" && log_alert \"RAM ${mem}% > ${MEM_THRESHOLD}%\"", "}", "check_disk() {", "    local disk", "    disk=$(df -h / | tail -1 | awk '{print $5}' | cut -d'%' -f1)", "    echo \"Disk: ${disk}%\"", "    greater \"$disk\" \"$DISK_THRESHOLD\" && log_alert \"Disk ${disk}% > ${DISK_THRESHOLD}%\"", "}", "check_load() {", "    echo \"Load average: $(cut -d' ' -f1-3 /proc/loadavg)\"", "}", "check_top_processes() {", "    echo \"--- Top 5 process (CPU) ---\"", "    ps aux --sort=-%cpu | head -6", "    echo \"--- Top 5 process (RAM) ---\"", "    ps aux --sort=-%mem | head -6", "}", "check_services() {", "    local s", "    for s in $SERVICES; do", "        if systemctl is-active --quiet \"$s\" 2>/dev/null; then", "            echo \"Service $s: UP\"", "        else", "            echo \"Service $s: DOWN\"", "            log_alert \"Service $s khong chay\"", "        fi", "    done", "}", "check_network() {", "    if ping -c 1 -W 2 8.8.8.8 > /dev/null 2>&1; then", "        echo \"Network: OK\"", "    else", "        echo \"Network: FAIL\"", "        log_alert \"Mat ket noi mang\"", "    fi", "}", "case \"$1\" in", "    --cpu)      check_cpu ;;", "    --memory)   check_memory ;;", "    --disk)     check_disk ;;", "    --services) check_services ;;", "    --network)  check_network ;;", "    --all|\"\")   check_cpu; check_memory; check_disk; check_load", "                check_top_processes; check_services; check_network ;;", "    *)          echo \"Usage: $0 {--all|--cpu|--memory|--disk|--services|--network}\"", "                exit 1 ;;", "esac"]}, {"t": "p", "s": "Chạy:"}, {"t": "code", "lines": ["chmod +x system_monitor.sh && ./system_monitor.sh --cpu && ./system_monitor.sh --disk"]}, {"t": "p", "s": "Kết quả mong đợi:"}, {"t": "code", "lines": ["CPU : 0.0%", "Disk: 47%", "(giá trị phụ thuộc máy của bạn)"]}, {"t": "p", "s": "Giải thích: Vì sao dùng \u0001bc -l\u0002: Bash chỉ so sánh số nguyên, còn CPU có dạng 85.3. Hàm \u0001greater\u0002 trả mã thoát 0/1 nên dùng được với \u0001&&\u0002. Nếu thiếu monitor.conf, các giá trị mặc định \u0001${VAR:-80}\u0002 vẫn giúp script chạy."}, {"t": "p", "s": "Mở rộng: thêm \u0001--help\u0002; gửi mail khi có cảnh báo (\u0001mail -s\u0002); chạy mỗi 5 phút bằng cron \u0001*/5 * * * *\u0002."}], "questions": []}, {"title": "Lab 3 (Bash): Chạy regression và tổng kết", "blocks": [{"t": "p", "s": "Đề bài: Chạy mọi file \u0001tests/test_*.sh\u0002, lưu log từng test vào \u0001logs/\u0002, đếm PASS/FAIL, tính tỉ lệ, liệt kê test lỗi. Script thoát với mã 1 nếu có test lỗi (để CI/CD nhận biết)."}, {"t": "p", "s": "Kỹ năng: vòng \u0001for\u0002, \u0001basename\u0002, \u0001$((...))\u0002, \u0001grep -q\u0002, \u0001bc\u0002, mã thoát, \u0001mkdir -p\u0002"}, {"t": "p", "s": "Chuẩn bị dữ liệu mẫu (dán vào terminal):"}, {"t": "code", "lines": ["mkdir -p tests", "for t in adder shifter counter; do", "  printf '#!/bin/bash\\necho \"Test %s PASS\"\\n' $t > tests/test_$t.sh", "done", "printf '#!/bin/bash\\necho \"ERROR: overflow\"\\necho \"Test fifo FAIL\"\\n' > tests/test_fifo.sh"]}, {"t": "p", "s": "Code mẫu:"}, {"t": "code", "lines": ["#!/bin/bash", "# run_regression.sh - Chay tat ca test trong tests/ va tong ket", "TEST_DIR=\"tests\"", "LOG_DIR=\"logs\"", "mkdir -p \"$LOG_DIR\"", "pass=0", "fail=0", "failed_list=\"\"", "for t in \"$TEST_DIR\"/test_*.sh; do", "    name=$(basename \"$t\" .sh)", "    bash \"$t\" > \"$LOG_DIR/$name.log\" 2>&1", "    if grep -q \"PASS\" \"$LOG_DIR/$name.log\"; then", "        echo \"[PASS] $name\"", "        pass=$((pass + 1))", "    else", "        echo \"[FAIL] $name\"", "        fail=$((fail + 1))", "        failed_list=\"$failed_list $name\"", "    fi", "done", "total=$((pass + fail))", "rate=$(echo \"scale=1; $pass * 100 / $total\" | bc)", "echo \"-----------------------------\"", "echo \"Total: $total  Pass: $pass  Fail: $fail  Rate: ${rate}%\"", "[ $fail -gt 0 ] && echo \"Failed:$failed_list\"", "# exit 0 neu tat ca PASS, nguoc lai exit 1", "[ $fail -eq 0 ]"]}, {"t": "p", "s": "Chạy:"}, {"t": "code", "lines": ["chmod +x run_regression.sh && ./run_regression.sh; echo \"exit=$?\""]}, {"t": "p", "s": "Kết quả mong đợi:"}, {"t": "code", "lines": ["[PASS] test_adder", "[PASS] test_counter", "[FAIL] test_fifo", "[PASS] test_shifter", "-----------------------------", "Total: 4  Pass: 3  Fail: 1  Rate: 75.0%", "Failed: test_fifo", "exit=1"]}, {"t": "p", "s": "Giải thích: Bash không chia số thực nên dùng \u0001bc\u0002 với \u0001scale=1\u0002. Dòng cuối \u0001[ $fail -eq 0 ]\u0002 đặt mã thoát của cả script. Trong lab thật, thay \u0001bash \"$t\"\u0002 bằng lệnh \u0001iverilog\u0002 + \u0001vvp\u0002 của từng testbench."}, {"t": "p", "s": "Mở rộng: chạy song song bằng \u0001&\u0002 và \u0001wait\u0002; ghi tổng kết vào \u0001summary.txt\u0002 kèm ngày giờ."}], "questions": []}, {"title": "Lab 4 (Tcl): Phân tích báo cáo timing", "blocks": [{"t": "p", "s": "Đề bài: Viết proc \u0001parse_timing {filename}\u0002 đọc file báo cáo, bỏ qua comment và dòng trống, bắt \u0001Path N: slack = X ns\u0002 bằng regexp, đếm tổng số path, liệt kê các path vi phạm (slack < 0) và tìm worst slack. Dùng \u0001catch\u0002 khi mở file."}, {"t": "p", "s": "Kỹ năng: \u0001catch\u0002, \u0001open/gets/close\u0002, \u0001string match\u0002, \u0001eq\u0002, \u0001regexp\u0002 + capture group, \u0001lappend\u0002, \u0001llength\u0002, \u0001foreach\u0002"}, {"t": "p", "s": "Chuẩn bị dữ liệu mẫu (dán vào terminal):"}, {"t": "code", "lines": ["cat > timing.rpt << 'EOF'", "Path 1: slack = 0.52 ns (MET)", "Path 2: slack = -0.25 ns (VIOLATED)", "# comment line", "Path 3: slack = 0.10 ns (MET)", "Path 4: slack = -1.30 ns (VIOLATED)", "EOF"]}, {"t": "p", "s": "Code mẫu:"}, {"t": "code", "lines": ["#!/usr/bin/env tclsh", "# parse_timing.tcl - Phan tich bao cao timing", "proc parse_timing {filename} {", "    if {[catch {open $filename r} fp]} {", "        puts \"Error: khong mo duoc $filename\"", "        return -1", "    }", "    set total 0", "    set violations {}", "    set worst 1e9", "    while {[gets $fp line] >= 0} {", "        if {[string match \"#*\" $line] || $line eq \"\"} { continue }", "        if {[regexp {^(Path \\d+): slack = ([-0-9.]+) ns} $line -> name slack]} {", "            incr total", "            if {$slack < $worst} { set worst $slack }", "            if {$slack < 0} { lappend violations \"$name ($slack ns)\" }", "        }", "    }", "    close $fp", "    puts \"Tong so path   : $total\"", "    puts \"So vi pham     : [llength $violations]\"", "    puts \"Worst slack    : $worst ns\"", "    foreach v $violations { puts \"  VIOLATION: $v\" }", "    return [llength $violations]", "}", "set n [parse_timing \"timing.rpt\"]", "if {$n > 0} {", "    puts \"RESULT: FAIL\"", "} elseif {$n == 0} {", "    puts \"RESULT: PASS\"", "}"]}, {"t": "p", "s": "Chạy:"}, {"t": "code", "lines": ["tclsh parse_timing.tcl"]}, {"t": "p", "s": "Kết quả mong đợi:"}, {"t": "code", "lines": ["Tong so path   : 4", "So vi pham     : 2", "Worst slack    : -1.30 ns", "  VIOLATION: Path 2 (-0.25 ns)", "  VIOLATION: Path 4 (-1.30 ns)", "RESULT: FAIL"]}, {"t": "p", "s": "Giải thích: Nhóm bắt 1 là \u0001Path N\u0002, nhóm 2 là slack (có thể âm nên regex có \u0001-\u0002 trong \u0001[-0-9.]\u0002). Nếu không mở được file, proc trả -1 và script không in PASS/FAIL (cả hai điều kiện đều sai)."}, {"t": "p", "s": "Mở rộng: phân loại slack thành ERROR / WARNING (< 0.2) / OK như bài if/elseif; ghi kết quả vào summary.txt bằng \u0001open ... w\u0002."}], "questions": []}, {"title": "Lab 5 (Tcl): Công cụ đọc và kiểm tra file cấu hình", "blocks": [{"t": "p", "s": "Đề bài: Mở rộng bài đọc settings.cfg: đọc vào dict, kiểm tra các key bắt buộc (width, height, frequency), tính diện tích và chu kỳ clock từ tần số \u0001100MHz\u0002 (period = 1000 / MHz ns), in toàn bộ cấu hình căn cột bằng \u0001format\u0002."}, {"t": "p", "s": "Kỹ năng: \u0001dict\u0002, \u0001catch\u0002 + \u0001error\u0002, \u0001regexp\u0002, \u0001expr\u0002, \u0001format\u0002, \u0001dict exists\u0002, \u0001exit\u0002"}, {"t": "p", "s": "Chuẩn bị dữ liệu mẫu (dán vào terminal):"}, {"t": "code", "lines": ["cat > settings.cfg << 'EOF'", "# settings.cfg", "width = 100", "height = 50", "frequency = 100MHz", "voltage = 1.2V", "debug = true", "EOF"]}, {"t": "p", "s": "Code mẫu:"}, {"t": "code", "lines": ["#!/usr/bin/env tclsh", "# config_tool.tcl - Doc cau hinh, kiem tra va tinh toan", "proc read_config {filename} {", "    set config [dict create]", "    if {[catch {open $filename r} fp]} {", "        error \"Khong mo duoc file: $filename\"", "    }", "    while {[gets $fp line] >= 0} {", "        if {[string match \"#*\" $line] || [string trim $line] eq \"\"} { continue }", "        if {[regexp {^\\s*(\\w+)\\s*=\\s*(.+)$} $line -> key value]} {", "            dict set config $key [string trim $value]", "        }", "    }", "    close $fp", "    return $config", "}", "proc require_keys {config keys} {", "    set missing {}", "    foreach k $keys {", "        if {![dict exists $config $k]} { lappend missing $k }", "    }", "    return $missing", "}", "proc clock_period_ns {freq} {", "    # \"100MHz\" -> 10.0 ns", "    if {![regexp {^(\\d+)MHz$} $freq -> mhz]} {", "        error \"Tan so khong hop le: $freq\"", "    }", "    return [expr {1000.0 / $mhz}]", "}", "if {[catch {read_config \"settings.cfg\"} config]} {", "    puts \"Loi: $config\"", "    exit 1", "}", "set missing [require_keys $config {width height frequency}]", "if {[llength $missing] > 0} {", "    puts \"Thieu key: $missing\"", "    exit 1", "}", "set area [expr {[dict get $config width] * [dict get $config height]}]", "puts \"Area   : $area\"", "puts \"Period : [clock_period_ns [dict get $config frequency]] ns\"", "dict for {k v} $config { puts [format \"  %-10s = %s\" $k $v] }"]}, {"t": "p", "s": "Chạy:"}, {"t": "code", "lines": ["tclsh config_tool.tcl"]}, {"t": "p", "s": "Kết quả mong đợi:"}, {"t": "code", "lines": ["Area   : 5000", "Period : 10.0 ns", "  width      = 100", "  height     = 50", "  frequency  = 100MHz", "  voltage    = 1.2V", "  debug      = true"]}, {"t": "p", "s": "Giải thích: \u0001error\u0002 ném lỗi, \u0001catch\u0002 ở ngoài bắt được và đặt thông báo vào biến \u0001config\u0002. \u00011000.0 / $mhz\u0002 dùng số thực để ra 10.0 chứ không phải số nguyên. Thử xóa dòng \u0001height\u0002 khỏi file để thấy thông báo \u0001Thieu key: height\u0002."}, {"t": "p", "s": "Mở rộng: kiểm tra \u0001voltage\u0002 có dạng \u0001\\d+(\\.\\d+)?V\u0002 và bắt lỗi giá trị không hợp lệ."}], "questions": []}, {"title": "Lab 6 (Tcl): Tạo project IC và phân loại file", "blocks": [{"t": "p", "s": "Đề bài: Chuyển \u0001create_project.sh\u0002 sang Tcl: nhận tên project từ dòng lệnh, báo lỗi nếu thiếu hoặc đã tồn tại, tạo cây thư mục, ghi README.md. Thêm proc \u0001file_type\u0002 dùng \u0001switch -glob\u0002 để phân loại file .v/.sv/.vh/.sdc/.tcl/.rpt."}, {"t": "p", "s": "Kỹ năng: \u0001argv\u0002, \u0001file exists\u0002, \u0001file mkdir\u0002, \u0001file join\u0002, \u0001open/puts/close\u0002, \u0001switch -glob\u0002, \u0001format\u0002"}, {"t": "p", "s": "Code mẫu:"}, {"t": "code", "lines": ["#!/usr/bin/env tclsh", "# gen_project.tcl - Tao cau truc project IC va phan loai file", "proc create_project {name} {", "    if {[file exists $name]} {", "        puts \"Error: Project $name already exists!\"", "        return 1", "    }", "    foreach d {rtl tb sim synth scripts reports/timing reports/power} {", "        file mkdir [file join $name $d]", "    }", "    set fp [open [file join $name README.md] w]", "    puts $fp \"# $name\"", "    puts $fp \"- rtl/     : RTL source code\"", "    puts $fp \"- tb/      : Testbenches\"", "    puts $fp \"- sim/     : Simulation results\"", "    puts $fp \"- synth/   : Synthesis outputs\"", "    puts $fp \"- reports/ : Analysis reports\"", "    puts $fp \"- scripts/ : Automation scripts\"", "    close $fp", "    puts \"Project $name created successfully!\"", "    return 0", "}", "proc file_type {filename} {", "    switch -glob -- $filename {", "        \"*.v\" - \"*.sv\" - \"*.vh\" { return \"HDL source\" }", "        \"*.sdc\"                 { return \"Constraints\" }", "        \"*.tcl\"                 { return \"Tcl script\" }", "        \"*.rpt\"                 { return \"Report\" }", "        default                 { return \"Unknown\" }", "    }", "}", "set name [lindex $argv 0]", "if {$name eq \"\"} {", "    puts \"Usage: tclsh gen_project.tcl <project_name>\"", "    exit 1", "}", "if {[create_project $name] != 0} { exit 1 }", "foreach f {top.v alu.sv timing.rpt run.tcl clock.sdc notes.txt} {", "    puts [format \"%-10s -> %s\" $f [file_type $f]]", "}"]}, {"t": "p", "s": "Chạy:"}, {"t": "code", "lines": ["tclsh gen_project.tcl demo     ;# chạy lại lần 2 sẽ báo Error ... already exists!"]}, {"t": "p", "s": "Kết quả mong đợi:"}, {"t": "code", "lines": ["Project demo created successfully!", "top.v      -> HDL source", "alu.sv     -> HDL source", "timing.rpt -> Report", "run.tcl    -> Tcl script", "clock.sdc  -> Constraints", "notes.txt  -> Unknown"]}, {"t": "p", "s": "Giải thích: Tcl: \u0001$argv\u0002 là list tham số dòng lệnh (tương ứng \u0001$1\u0002 trong Bash). \u0001file mkdir\u0002 giống \u0001mkdir -p\u0002 (tự tạo thư mục cha). \u0001switch -glob\u0002 cần vì pattern \u0001*.v\u0002 dùng ký tự đại diện."}, {"t": "p", "s": "Mở rộng: thêm sinh sẵn \u0001scripts/run.tcl\u0002 và \u0001sim/Makefile\u0002; hoặc proc \u0001list_files dir\u0002 dùng \u0001glob\u0002."}], "questions": []}, {"title": "Lab 7 (Tcl): Slack Report Parser (lời giải đề Bài tập 2 ngày 16/10)", "blocks": [{"t": "p", "s": "Đề bài: Viết thủ tục \u0001parse_timing_report {report_file threshold}\u0002 (threshold mặc định 0.0): mở file timing.rep, duyệt từng dòng, lọc các endpoint có slack < threshold, rồi trả và in số endpoint vi phạm, WNS (slack tệ nhất) và TNS (tổng các slack âm)."}, {"t": "p", "s": "Kỹ năng: \u0001catch\u0002/\u0001error\u0002, \u0001open/gets/close\u0002, \u0001regexp\u0002 + capture group, so sánh số, \u0001lappend\u0002, \u0001lassign\u0002, \u0001format\u0002, tham số mặc định"}, {"t": "p", "s": "Chuẩn bị dữ liệu mẫu (dán vào terminal):"}, {"t": "code", "lines": ["cat > timing.rep << 'EOF'", "#---------timing.rep--------", "Endpoint: reg_a_reg[0]/D (rising edge-triggered flip-flop)", "Path Group: clk_core", "slack (VIOLATED)                -0.45", "Endpoint: reg_b_reg[3]/D (rising edge-triggered flip-flop)", "Path Group: clk_core", "slack (MET)                     0.12", "Endpoint: fifo_mem_reg[7]/D (rising edge-triggered flip-flop)", "Path Group: clk_core", "slack (VIOLATED)                -1.20", "EOF"]}, {"t": "p", "s": "Code mẫu:"}, {"t": "code", "lines": ["#!/usr/bin/env tclsh", "# slack_parser.tcl - Phan tich bao cao timing (WNS, TNS)", "proc parse_timing_report {report_file {threshold 0.0}} {", "    if {[catch {open $report_file r} fp]} {", "        error \"Khong mo duoc file: $report_file\"", "    }", "    set endpoint \"\"", "    set count 0", "    set wns 0.0", "    set tns 0.0", "    set violated {}", "    while {[gets $fp line] >= 0} {", "        if {[regexp {^Endpoint:\\s+(\\S+)} $line -> endpoint]} { continue }", "        if {[regexp {^slack \\((\\w+)\\)\\s+(-?[0-9.]+)} $line -> status slack]} {", "            if {$slack < $threshold} {", "                incr count", "                lappend violated [list $endpoint $slack]", "                if {$slack < $wns} { set wns $slack }", "                if {$slack < 0}    { set tns [expr {$tns + $slack}] }", "            }", "        }", "    }", "    close $fp", "    puts \"Cac path co slack < $threshold:\"", "    foreach v $violated {", "        lassign $v ep sl", "        puts [format \"  %-18s %6.2f\" $ep $sl]", "    }", "    puts \"So endpoint vi pham : $count\"", "    puts \"WNS                 : [format %.2f $wns]\"", "    puts \"TNS                 : [format %.2f $tns]\"", "    return [list $count $wns $tns]", "}", "lassign [parse_timing_report \"timing.rep\"] n wns tns", "if {$n > 0} { puts \"RESULT: FAIL\" } else { puts \"RESULT: PASS\" }", "puts \"--- threshold = 0.2 ---\"", "parse_timing_report \"timing.rep\" 0.2"]}, {"t": "p", "s": "Chạy:"}, {"t": "code", "lines": ["tclsh slack_parser.tcl"]}, {"t": "p", "s": "Kết quả mong đợi:"}, {"t": "code", "lines": ["Cac path co slack < 0.0:", "  reg_a_reg[0]/D      -0.45", "  fifo_mem_reg[7]/D   -1.20", "So endpoint vi pham : 2", "WNS                 : -1.20", "TNS                 : -1.65", "RESULT: FAIL", "--- threshold = 0.2 ---", "Cac path co slack < 0.2:", "  reg_a_reg[0]/D      -0.45", "  reg_b_reg[3]/D       0.12", "  fifo_mem_reg[7]/D   -1.20", "So endpoint vi pham : 3", "WNS                 : -1.20", "TNS                 : -1.65"]}, {"t": "p", "s": "Giải thích: Trạng thái giữa các dòng: biến \u0001endpoint\u0002 nhớ tên endpoint gần nhất. Điều kiện vi phạm là so sánh số \u0001slack < $threshold\u0002 (không dựa vào chữ VIOLATED). TNS chỉ cộng slack âm nên đổi ngưỡng sang 0.2 thì số endpoint tăng nhưng TNS giữ nguyên. Đề thi giấy thường chấm các ý: mở file bằng \u0001open\u0002, \u0001gets\u0002 trong \u0001while\u0002, \u0001regexp\u0002, so sánh với threshold, tính WNS/TNS, \u0001close\u0002, \u0001return\u0002."}, {"t": "p", "s": "Mở rộng: thêm dòng \u0001Path Group\u0002 vào kết quả; xuất danh sách vi phạm ra file \u0001violations.txt\u0002 bằng \u0001open ... w\u0002."}], "questions": []}, {"title": "Lab 8 (Tcl): Liệt kê và thống kê file HDL bằng glob", "blocks": [{"t": "p", "s": "Đề bài: Viết proc \u0001list_hdl {dir}\u0002 liệt kê các file .v, .sv, .vhd trong thư mục (đã sắp xếp), đếm theo từng đuôi và in tổng. Báo lỗi nếu \u0001dir\u0002 không phải thư mục. Thư mục lấy từ dòng lệnh (mặc định là thư mục hiện tại)."}, {"t": "p", "s": "Kỹ năng: \u0001glob -nocomplain -directory\u0002, \u0001lsort\u0002, \u0001file tail\u0002, \u0001file isdirectory\u0002, \u0001foreach\u0002, \u0001incr\u0002, \u0001argv\u0002/\u0001argc\u0002, \u0001catch\u0002"}, {"t": "p", "s": "Chuẩn bị dữ liệu mẫu (dán vào terminal):"}, {"t": "code", "lines": ["mkdir -p proj && touch proj/alu.v proj/counter.v proj/top.sv proj/fifo.vhd proj/readme.txt"]}, {"t": "p", "s": "Code mẫu:"}, {"t": "code", "lines": ["#!/usr/bin/env tclsh", "# list_hdl.tcl - Liet ke va thong ke file HDL trong project", "proc list_hdl {dir} {", "    if {![file isdirectory $dir]} {", "        error \"Khong phai thu muc: $dir\"", "    }", "    set total 0", "    foreach ext {v sv vhd} {", "        set files [lsort [glob -nocomplain -directory $dir *.$ext]]", "        set n [llength $files]", "        incr total $n", "        puts \"--- .$ext: $n file ---\"", "        foreach f $files { puts \"  [file tail $f]\" }", "    }", "    puts \"Tong so file HDL: $total\"", "    return $total", "}", "set dir [expr {$argc > 0 ? [lindex $argv 0] : \".\"}]", "if {[catch {list_hdl $dir} err]} {", "    puts \"Loi: $err\"", "    exit 1", "}"]}, {"t": "p", "s": "Chạy:"}, {"t": "code", "lines": ["tclsh list_hdl.tcl proj      ;# thử thêm: tclsh list_hdl.tcl khong_co  (báo lỗi, exit 1)"]}, {"t": "p", "s": "Kết quả mong đợi:"}, {"t": "code", "lines": ["--- .v: 2 file ---", "  alu.v", "  counter.v", "--- .sv: 1 file ---", "  top.sv", "--- .vhd: 1 file ---", "  fifo.vhd", "Tong so file HDL: 4"]}, {"t": "p", "s": "Giải thích: \u0001glob -directory $dir\u0002 tìm trong thư mục chỉ định và trả đường dẫn đầy đủ nên dùng \u0001file tail\u0002 để chỉ in tên file. \u0001lsort\u0002 vì thứ tự của \u0001glob\u0002 không đảm bảo. Đề lớp dùng \u0001cd proj\u0002 rồi \u0001glob *.$ext\u0002; bản này không cần đổi thư mục làm việc."}, {"t": "p", "s": "Mở rộng: lưu kết quả vào dict (key = đuôi, value = list file) rồi in bằng \u0001dict for\u0002."}], "questions": []}]}, {"title": "Phần F. Kiến thức mở rộng ngoài slide", "sections": [{"title": "Tổng quan", "blocks": [{"t": "p", "s": "Phần này vượt ra ngoài slide để phòng khi thầy hỏi rộng hơn nhưng vẫn liên quan: các cặp lệnh dễ nhầm, câu bẫy, tìm lỗi trong code và kiến thức khái quát. Tôi đã chạy thử các hành vi quan trọng (Bash 5, Tcl 8.6) thay vì chỉ dựa vào trí nhớ."}], "questions": []}, {"title": "Bảng phân biệt các cặp dễ nhầm", "blocks": [{"t": "table", "rows": [["Cặp cần phân biệt", "Điểm khác chính"], ["Bash: \u0001[ ]\u0002 và \u0001[[ ]]\u0002", "\u0001[ ]\u0002 là lệnh \u0001test\u0002 (POSIX), phải quote biến. \u0001[[ ]]\u0002 là cú pháp mở rộng của Bash: dùng được \u0001&&\u0002, \u0001||\u0002, so khớp mẫu \u0001==\u0002, regex \u0001=~\u0002, ít lỗi khi biến rỗng."], ["Bash: \u0001$*\u0002 và \u0001\"$@\"\u0002", "\u0001\"$@\"\u0002 giữ mỗi tham số là một từ riêng (kể cả có dấu cách). \u0001$*\u0002 không quote bị tách theo dấu cách."], ["Bash: nháy đơn và nháy kép", "Nháy đơn \u0001'...'\u0002 giữ nguyên mọi ký tự (không thay \u0001$\u0002). Nháy kép \u0001\"...\"\u0002 vẫn thay \u0001$VAR\u0002, \u0001$(...)\u0002."], ["Bash: \u0001;\u0002 \u0001&&\u0002 \u0001||\u0002 \u0001&\u0002", "\u0001;\u0002 luôn chạy lệnh sau. \u0001&&\u0002 chạy khi lệnh trước thành công. \u0001||\u0002 chạy khi lệnh trước thất bại. \u0001&\u0002 chạy lệnh nền."], ["Bash: \u0001>\u0002 \u0001>>\u0002 \u00012>\u0002 \u00012>&1\u0002", "\u0001>\u0002 ghi đè stdout; \u0001>>\u0002 nối thêm; \u00012>\u0002 stderr; \u00012>&1\u0002 gộp stderr vào nơi stdout đang trỏ tới."], ["Bash: \u0001./s.sh\u0002 và \u0001source s.sh\u0002", "\u0001./s.sh\u0002 chạy ở tiến trình con (biến, \u0001cd\u0002 không giữ lại). \u0001source\u0002 chạy trong shell hiện tại (biến được giữ)."], ["Bash: \u0001=\u0002 và \u0001-eq\u0002 trong \u0001[ ]\u0002", "\u0001=\u0002 so sánh chuỗi; \u0001-eq -ne -lt -gt\u0002 so sánh số nguyên. Số thực phải dùng \u0001bc\u0002/\u0001awk\u0002."], ["Bash: \u0001export X=1\u0002 và \u0001X=1\u0002", "Chỉ biến được \u0001export\u0002 mới truyền xuống tiến trình con."], ["Bash: hard link và symbolic link", "Symbolic link (\u0001ln -s\u0002) trỏ theo tên, xóa file gốc thì link hỏng. Hard link (\u0001ln\u0002) trỏ cùng dữ liệu, xóa tên gốc vẫn đọc được."], ["Tcl: \u0001==\u0002 và \u0001eq\u0002", "\u0001==\u0002 so sánh theo số nếu được (\u0001\"1.0\" == \"1\"\u0002 là đúng). \u0001eq\u0002 so sánh chuỗi (\u0001\"1.0\" eq \"1\"\u0002 là sai)."], ["Tcl: \u0001string match\u0002 và \u0001regexp\u0002", "\u0001string match\u0002 dùng glob (\u0001*\u0002, \u0001?\u0002). \u0001regexp\u0002 dùng biểu thức chính quy (\u0001.\u0002 = ký tự bất kỳ). \u0001string match \"a.c\" abc\u0002 là 0, \u0001regexp {a.c} abc\u0002 là 1."], ["Tcl: \u0001append\u0002 và \u0001lappend\u0002", "\u0001append\u0002 nối vào chuỗi. \u0001lappend\u0002 thêm phần tử vào list (có thể nhiều phần tử). Cả hai nhận TÊN biến."], ["Tcl: \u0001list\u0002 và \u0001{ }\u0002", "\u0001[list $x b]\u0002 thay biến trong list. \u0001{$x b}\u0002 giữ nguyên chữ \u0001$x\u0002. \u0001list \"a b\" c\u0002 có 2 phần tử."], ["Tcl: list, array, dict", "list = dãy có thứ tự (chỉ số). array = biến tập key-value, không dùng \u0001$arr\u0002 như một giá trị. dict = key-value dạng giá trị, truyền được vào proc."], ["Tcl: \u0001puts\u0002 và \u0001return\u0002", "\u0001puts\u0002 in ra màn hình (trả chuỗi rỗng). \u0001return\u0002 trả giá trị cho nơi gọi."], ["Tcl: \u0001global\u0002, \u0001upvar\u0002, \u0001uplevel\u0002", "\u0001global\u0002 truy cập biến toàn cục. \u0001upvar\u0002 liên kết biến cục bộ với biến của nơi gọi. \u0001uplevel\u0002 chạy một đoạn script ở phạm vi của nơi gọi."], ["Tcl: \u0001exec\u0002 và \u0001source\u0002", "\u0001exec\u0002 chạy chương trình ngoài (ví dụ \u0001exec date\u0002). \u0001source file.tcl\u0002 nạp và chạy một file Tcl."], ["Tcl: \u0001lsort\u0002 mặc định và \u0001-integer\u0002", "Mặc định sắp theo chuỗi: \u000110 100 9\u0002. Với \u0001-integer\u0002 mới theo số: \u00019 10 100\u0002."], ["Tcl: \u0001lsearch\u0002 mặc định và \u0001-exact\u0002", "Mặc định là glob: \u0001lsearch {apple banana} \"a*\"\u0002 trả 0. Với \u0001-exact\u0002 thì tìm đúng chuỗi \u0001a*\u0002 và trả -1."]]}], "questions": []}, {"title": "F1. Bash mở rộng: phân biệt và bẫy", "blocks": [], "questions": [{"id": 172, "q": "Điểm khác chính giữa \u0001[ ]\u0002 và \u0001[[ ]]\u0002 trong Bash?", "code": [], "opts": [{"k": "A", "v": "\u0001[[ ]]\u0002 là cú pháp mở rộng của Bash: hỗ trợ \u0001&&\u0002, \u0001||\u0002, so khớp mẫu và regex \u0001=~\u0002, ít lỗi hơn khi biến rỗng; \u0001[ ]\u0002 là lệnh \u0001test\u0002"}, {"k": "B", "v": "Hai cái hoàn toàn giống nhau"}, {"k": "C", "v": "\u0001[ ]\u0002 mới hỗ trợ regex"}, {"k": "D", "v": "\u0001[[ ]]\u0002 chỉ dùng cho số"}], "ans": ["A"], "exp": "Ví dụ đã thử: \u0001[[ \"abc\" == a* ]]\u0002 đúng (khớp mẫu); \u0001[[ \"abc123\" =~ ^[a-z]+[0-9]+$ ]]\u0002 đúng (regex).", "expcode": []}, {"id": 173, "q": "Chạy \u0001x=\"\"; [ $x = \"a\" ]\u0002. Kết quả?", "code": [], "opts": [{"k": "A", "v": "Trả sai (mã 1), không lỗi"}, {"k": "B", "v": "Báo lỗi \u0001unary operator expected\u0002 (mã 2) vì \u0001$x\u0002 biến mất sau khi mở rộng"}, {"k": "C", "v": "Trả đúng"}, {"k": "D", "v": "Gán x = a"}], "ans": ["B"], "exp": "Thành \u0001[ = \"a\" ]\u0002 nên cú pháp sai. Viết \u0001[ \"$x\" = \"a\" ]\u0002 thì chạy đúng và trả sai (mã 1). Luôn quote biến trong \u0001[ ]\u0002.", "expcode": []}, {"id": 174, "q": "Gọi \u0001./a.sh \"a b\" c\u0002. Số lần chạy của \u0001for i in \"$@\"\u0002 và \u0001for i in $*\u0002 lần lượt?", "code": ["for i in \"$@\"; do echo \"A:$i\"; done", "for i in $*;   do echo \"S:$i\"; done"], "opts": [{"k": "A", "v": "2 và 3"}, {"k": "B", "v": "3 và 3"}, {"k": "C", "v": "2 và 2"}, {"k": "D", "v": "1 và 3"}], "ans": ["A"], "exp": "\u0001\"$@\"\u0002 giữ \u0001a b\u0002 thành một tham số (2 lần). \u0001$*\u0002 không quote bị tách thành a, b, c (3 lần). Đã chạy thử.", "expcode": []}, {"id": 175, "q": "Ý nghĩa của \u0001$#\u0002, \u0001$$\u0002, \u0001$!\u0002 trong Bash?", "code": [], "opts": [{"k": "A", "v": "Số tham số; PID của shell hiện tại; PID của tiến trình nền gần nhất"}, {"k": "B", "v": "PID; số tham số; mã thoát"}, {"k": "C", "v": "Mã thoát; PID; số tham số"}, {"k": "D", "v": "Tên script; số dòng; PID"}], "ans": ["A"], "exp": "Còn \u0001$?\u0002 là mã thoát lệnh gần nhất, \u0001$0\u0002 là tên script.", "expcode": []}, {"id": 176, "q": "\u0001X=5; echo '$X' \"$X\"\u0002 in ra?", "code": [], "opts": [{"k": "A", "v": "5 5"}, {"k": "B", "v": "$X 5"}, {"k": "C", "v": "$X $X"}, {"k": "D", "v": "5 $X"}], "ans": ["B"], "exp": "Nháy đơn không thay biến; nháy kép có thay. Đây cũng là lý do dùng nháy đơn khi \u0001echo\u0002 code Tcl vào file.", "expcode": []}, {"id": 177, "q": "\u0001true && echo A || echo B\u0002 và \u0001false && echo A || echo B\u0002 lần lượt in?", "code": [], "opts": [{"k": "A", "v": "A và B"}, {"k": "B", "v": "A và A"}, {"k": "C", "v": "B và B"}, {"k": "D", "v": "A A và B"}], "ans": ["A"], "exp": "\u0001&&\u0002 chạy khi lệnh trước thành công; \u0001||\u0002 chạy khi thất bại. \u0001;\u0002 thì luôn chạy lệnh sau.", "expcode": [], "ns": 1}, {"id": 178, "q": "\u0001X=1; bash -c 'echo [$X]'\u0002 in gì, và nếu có \u0001export X\u0002 trước đó thì in gì?", "code": [], "opts": [{"k": "A", "v": "\u0001[]\u0002 và \u0001[1]\u0002"}, {"k": "B", "v": "\u0001[1]\u0002 và \u0001[1]\u0002"}, {"k": "C", "v": "\u0001[]\u0002 và \u0001[]\u0002"}, {"k": "D", "v": "\u0001[1]\u0002 và \u0001[]\u0002"}], "ans": ["A"], "exp": "Biến thường chỉ có trong shell hiện tại; \u0001export\u0002 đưa biến vào môi trường của tiến trình con. Đã thử.", "expcode": []}, {"id": 179, "q": "Dùng để debug script Bash: \u0001set -x\u0002 và \u0001bash -n script.sh\u0002 khác nhau thế nào?", "code": [], "opts": [{"k": "A", "v": "\u0001set -x\u0002 in từng lệnh khi chạy; \u0001bash -n\u0002 chỉ kiểm tra cú pháp, không chạy"}, {"k": "B", "v": "\u0001set -x\u0002 kiểm tra cú pháp; \u0001bash -n\u0002 in từng lệnh"}, {"k": "C", "v": "Cả hai đều chạy script"}, {"k": "D", "v": "Cả hai chỉ kiểm tra cú pháp"}], "ans": ["A"], "exp": "Đã thử: \u0001bash -n\u0002 với \u0001if then\u0002 báo \u0001syntax error near unexpected token\u0002.", "expcode": [], "ns": 1}, {"id": 180, "q": "\u0001S=hello; echo ${#S} ${U:-abc}\u0002 in ra?", "code": [], "opts": [{"k": "A", "v": "5 abc"}, {"k": "B", "v": "hello abc"}, {"k": "C", "v": "5 (rỗng)"}, {"k": "D", "v": "Lỗi"}], "ans": ["A"], "exp": "\u0001${#S}\u0002 là độ dài chuỗi; \u0001${U:-abc}\u0002 dùng giá trị mặc định abc khi U chưa đặt hoặc rỗng. Mẫu này đã dùng trong script: \u0001${CPU_THRESHOLD:-80}\u0002.", "expcode": []}, {"id": 181, "q": "Với dữ liệu a, b, a (mỗi dòng một giá trị), \u0001uniq -c\u0002 không có \u0001sort\u0002 cho kết quả?", "code": [], "opts": [{"k": "A", "v": "a: 2, b: 1"}, {"k": "B", "v": "a: 1, b: 1, a: 1 (ba dòng, vì \u0001uniq\u0002 chỉ gộp các dòng liền kề)"}, {"k": "C", "v": "Lỗi"}, {"k": "D", "v": "a: 3"}], "ans": ["B"], "exp": "Phải \u0001sort | uniq -c\u0002 mới ra \u00012 a\u0002, \u00011 b\u0002. Đã thử cả hai.", "expcode": []}, {"id": 182, "q": "\u0001n=0; cat f | while read l; do n=$((n+1)); done; echo $n\u0002 với f có 3 dòng in ra?", "code": [], "opts": [{"k": "A", "v": "3"}, {"k": "B", "v": "0 (vòng lặp sau pipe chạy ở subshell nên biến n bên ngoài không đổi)"}, {"k": "C", "v": "1"}, {"k": "D", "v": "Lỗi"}], "ans": ["B"], "exp": "Viết \u0001while read l; do ...; done < f\u0002 (không dùng pipe) thì in 3. Đã thử.", "expcode": []}, {"id": 183, "q": "\u0001[ 10 = 10.0 ]\u0002 và \u0001[ 10 -eq 10 ]\u0002 cho kết quả?", "code": [], "opts": [{"k": "A", "v": "Sai và đúng"}, {"k": "B", "v": "Đúng và đúng"}, {"k": "C", "v": "Đúng và sai"}, {"k": "D", "v": "Lỗi và đúng"}], "ans": ["A"], "exp": "\u0001=\u0002 so sánh chuỗi (“10” khác “10.0”). \u0001-eq\u0002 so sánh số nguyên. Số thực không dùng được \u0001-eq\u0002 nên script monitor dùng \u0001bc -l\u0002.", "expcode": []}, {"id": 184, "q": "Script \u0001setx.sh\u0002 chứa \u0001X=7\u0002. Sau \u0001bash setx.sh\u0002 thì X trong shell hiện tại là gì, và sau \u0001source setx.sh\u0002?", "code": [], "opts": [{"k": "A", "v": "Rỗng, rồi 7"}, {"k": "B", "v": "7, rồi 7"}, {"k": "C", "v": "Rỗng, rồi rỗng"}, {"k": "D", "v": "7, rồi rỗng"}], "ans": ["A"], "exp": "Chạy bằng \u0001bash\u0002/\u0001./\u0002 tạo tiến trình con nên biến mất. \u0001source\u0002 (hoặc \u0001. file\u0002) chạy trong shell hiện tại. Đã thử.", "expcode": []}, {"id": 185, "q": "Gõ \u0001backup.sh\u0002 báo \u0001command not found\u0002 nhưng \u0001./backup.sh\u0002 chạy được. Vì sao?", "code": [], "opts": [{"k": "A", "v": "Thư mục hiện tại \u0001.\u0002 không nằm trong \u0001$PATH\u0002, nên phải chỉ rõ đường dẫn \u0001./\u0002"}, {"k": "B", "v": "File không có quyền chạy"}, {"k": "C", "v": "Thiếu shebang"}, {"k": "D", "v": "Sai tên file"}], "ans": ["A"], "exp": "Nếu thiếu quyền chạy thì lỗi sẽ là \u0001Permission denied\u0002. Còn lệnh không tồn tại có mã thoát 127 (đã thử).", "expcode": []}, {"id": 186, "q": "Tạo \u0001f\u0002, hard link \u0001hard\u0002 và symbolic link \u0001sym\u0002 trỏ tới \u0001f\u0002, rồi \u0001rm f\u0002. Điều gì xảy ra?", "code": [], "opts": [{"k": "A", "v": "\u0001cat hard\u0002 vẫn đọc được, \u0001cat sym\u0002 báo lỗi (link hỏng)"}, {"k": "B", "v": "Cả hai vẫn đọc được"}, {"k": "C", "v": "Cả hai báo lỗi"}, {"k": "D", "v": "\u0001hard\u0002 hỏng, \u0001sym\u0002 vẫn đọc"}], "ans": ["A"], "exp": "Symbolic link chỉ lưu tên đường dẫn đến \u0001f\u0002; hard link giữ cùng dữ liệu. Đã thử.", "expcode": [], "ns": 1}, {"id": 187, "q": "\u0001sed 's/old/new/' g\u0002 và \u0001sed -i 's/old/new/g' g\u0002 khác nhau thế nào?", "code": [], "opts": [{"k": "A", "v": "Lệnh đầu chỉ in kết quả ra màn hình (file g không đổi); lệnh sau sửa trực tiếp file g"}, {"k": "B", "v": "Giống nhau"}, {"k": "C", "v": "Lệnh đầu sửa file; lệnh sau chỉ in"}, {"k": "D", "v": "Cả hai đều xóa file"}], "ans": ["A"], "exp": "\u0001-i\u0002 = in-place. \u0001g\u0002 ở cuối là thay mọi lần xuất hiện trên mỗi dòng.", "expcode": [], "ns": 1}, {"id": 188, "q": "\u0001for t in a b c; do ./run.sh $t & done; wait\u0002 làm gì?", "code": [], "opts": [{"k": "A", "v": "Chạy 3 lần \u0001run.sh\u0002 song song ở nền, \u0001wait\u0002 đợi cả ba xong mới đi tiếp"}, {"k": "B", "v": "Chạy tuần tự từng cái"}, {"k": "C", "v": "Chỉ chạy \u0001run.sh c\u0002"}, {"k": "D", "v": "Lỗi"}], "ans": ["A"], "exp": "\u0001&\u0002 đưa lệnh vào nền, \u0001$!\u0002 là PID của job nền gần nhất. Dùng để chạy regression song song.", "expcode": [], "ns": 1}, {"id": 189, "q": "Mã thoát (\u0001$?\u0002) khi gõ một lệnh không tồn tại là?", "code": [], "opts": [{"k": "A", "v": "0"}, {"k": "B", "v": "1"}, {"k": "C", "v": "127"}, {"k": "D", "v": "255"}], "ans": ["C"], "exp": "0 = thành công; 127 = command not found; 126 = không có quyền chạy. Đã thử: 127.", "expcode": []}]}, {"title": "F2. Tcl mở rộng: phân biệt và bẫy", "blocks": [], "questions": [{"id": 190, "q": "\u0001set x 5\u0002 rồi \u0001set a [list $x b]\u0002 và \u0001set b {$x b}\u0002. Hai biến a, b lần lượt là?", "code": [], "opts": [{"k": "A", "v": "\u00015 b\u0002 và \u0001$x b\u0002"}, {"k": "B", "v": "\u0001$x b\u0002 và \u00015 b\u0002"}, {"k": "C", "v": "\u00015 b\u0002 và \u00015 b\u0002"}, {"k": "D", "v": "Lỗi"}], "ans": ["A"], "exp": "\u0001[list ...]\u0002 có substitution; braces thì không.", "expcode": []}, {"id": 191, "q": "\u0001llength [list \"a b\" c]\u0002 bằng?", "code": [], "opts": [{"k": "A", "v": "2 (a b là một phần tử)"}, {"k": "B", "v": "3"}, {"k": "C", "v": "1"}, {"k": "D", "v": "4"}], "ans": ["A"], "exp": "\u0001list\u0002 giữ phần tử có khoảng trắng nguyên vẹn. Còn \u0001llength {a b c}\u0002 là 3.", "expcode": []}, {"id": 192, "q": "\u0001join [split \"a,b,c\" \",\"] \"-\"\u0002 cho?", "code": [], "opts": [{"k": "A", "v": "a-b-c"}, {"k": "B", "v": "a,b,c"}, {"k": "C", "v": "a b c"}, {"k": "D", "v": "abc"}], "ans": ["A"], "exp": "\u0001split chuỗi dấu_phân_cách\u0002 tạo list; \u0001join list dấu_nối\u0002 ghép lại. Hữu ích khi parse dòng CSV hoặc đường dẫn.", "expcode": []}, {"id": 193, "q": "\u0001set s a; append s b c\u0002 rồi \u0001set l a; lappend l b c\u0002. Giá trị s và \u0001llength $l\u0002?", "code": [], "opts": [{"k": "A", "v": "s = abc, llength = 3"}, {"k": "B", "v": "s = a b c, llength = 3"}, {"k": "C", "v": "s = abc, llength = 1"}, {"k": "D", "v": "s = a, llength = 3"}], "ans": ["A"], "exp": "\u0001append\u0002 nối chuỗi; \u0001lappend\u0002 thêm từng phần tử vào list. Cả hai nhận TÊN biến (không có \u0001$\u0002).", "expcode": []}, {"id": 194, "q": "\u0001expr {7/2}\u0002, \u0001expr {7/2.0}\u0002, \u0001expr {5 % 3}\u0002 lần lượt?", "code": [], "opts": [{"k": "A", "v": "3, 3.5, 2"}, {"k": "B", "v": "3.5, 3.5, 2"}, {"k": "C", "v": "3, 3, 1"}, {"k": "D", "v": "4, 3.5, 2"}], "ans": ["A"], "exp": "Chia hai số nguyên cho kết quả nguyên; chỉ cần một số thực là ra số thực. Đó là lý do slide dùng \u00011000.0 / ...\u0002 và \u0001double($n)\u0002.", "expcode": []}, {"id": 195, "q": "\u0001expr {\"1.0\" == \"1\"}\u0002 và \u0001expr {\"1.0\" eq \"1\"}\u0002 lần lượt?", "code": [], "opts": [{"k": "A", "v": "1 và 0"}, {"k": "B", "v": "0 và 1"}, {"k": "C", "v": "1 và 1"}, {"k": "D", "v": "0 và 0"}], "ans": ["A"], "exp": "\u0001==\u0002 so sánh số khi hai vế đều là số; \u0001eq\u0002 luôn so sánh chuỗi.", "expcode": []}, {"id": 196, "q": "\u0001string match \"a.c\" abc\u0002 và \u0001regexp {a.c} abc\u0002 lần lượt?", "code": [], "opts": [{"k": "A", "v": "0 và 1"}, {"k": "B", "v": "1 và 1"}, {"k": "C", "v": "1 và 0"}, {"k": "D", "v": "0 và 0"}], "ans": ["A"], "exp": "Trong glob dấu \u0001.\u0002 là ký tự thường; trong regex \u0001.\u0002 khớp ký tự bất kỳ.", "expcode": []}, {"id": 197, "q": "\u0001lsearch {apple banana} \"a*\"\u0002 và \u0001lsearch -exact {apple banana} \"a*\"\u0002 lần lượt?", "code": [], "opts": [{"k": "A", "v": "0 và -1"}, {"k": "B", "v": "0 và 0"}, {"k": "C", "v": "-1 và -1"}, {"k": "D", "v": "-1 và 0"}], "ans": ["A"], "exp": "Mặc định \u0001lsearch\u0002 dùng glob nên \u0001a*\u0002 khớp \u0001apple\u0002 (chỉ số 0). Với \u0001-exact\u0002 thì tìm đúng chuỗi \u0001a*\u0002.", "expcode": []}, {"id": 198, "q": "\u0001lsort {10 9 100}\u0002 và \u0001lsort -integer {10 9 100}\u0002 lần lượt?", "code": [], "opts": [{"k": "A", "v": "10 100 9 và 9 10 100"}, {"k": "B", "v": "9 10 100 và 9 10 100"}, {"k": "C", "v": "100 10 9 và 9 10 100"}, {"k": "D", "v": "10 9 100 và 10 9 100"}], "ans": ["A"], "exp": "Mặc định sắp theo chuỗi (ASCII). Muốn theo số phải thêm \u0001-integer\u0002 hoặc \u0001-real\u0002.", "expcode": []}, {"id": 199, "q": "Sau \u0001set arr(k) 1\u0002, lệnh \u0001puts $arr\u0002 sẽ?", "code": [], "opts": [{"k": "A", "v": "In 1"}, {"k": "B", "v": "Báo lỗi \u0001can't read \"arr\": variable is array\u0002"}, {"k": "C", "v": "In k"}, {"k": "D", "v": "In rỗng"}], "ans": ["B"], "exp": "Array không phải là một giá trị đơn nên không \u0001$arr\u0002 được; phải \u0001$arr(k)\u0002 hoặc \u0001array get arr\u0002. Dict thì \u0001$d\u0002 là một giá trị, truyền được vào proc.", "expcode": []}, {"id": 200, "q": "\u0001proc f {} {puts 5}\u0002. Sau \u0001set r [f]\u0002, màn hình in gì và r bằng gì?", "code": [], "opts": [{"k": "A", "v": "In 5; r là chuỗi rỗng"}, {"k": "B", "v": "Không in gì; r = 5"}, {"k": "C", "v": "In 5; r = 5"}, {"k": "D", "v": "Lỗi"}], "ans": ["A"], "exp": "\u0001puts\u0002 chỉ in ra rồi trả chuỗi rỗng; muốn trả giá trị phải \u0001return 5\u0002 (hoặc để 5 là lệnh cuối).", "expcode": []}, {"id": 201, "q": "\u0001set g 1; proc f {} {puts $g}; f\u0002 sẽ?", "code": [], "opts": [{"k": "A", "v": "In 1"}, {"k": "B", "v": "Báo lỗi \u0001can't read \"g\": no such variable\u0002 (biến toàn cục không thấy trong proc)"}, {"k": "C", "v": "In rỗng"}, {"k": "D", "v": "In g"}], "ans": ["B"], "exp": "Phải khai \u0001global g\u0002 trong proc, hoặc truyền g làm tham số.", "expcode": []}, {"id": 202, "q": "\u0001string map {a 1 b 2} \"abcab\"\u0002 cho?", "code": [], "opts": [{"k": "A", "v": "12c12"}, {"k": "B", "v": "abcab"}, {"k": "C", "v": "1 2 c 1 2"}, {"k": "D", "v": "12c"}], "ans": ["A"], "exp": "\u0001string map\u0002 thay đồng thời nhiều cặp chuỗi cũ → mới.", "expcode": []}, {"id": 203, "q": "\u0001file extension a.tar.gz\u0002, \u0001file rootname a.v\u0002, \u0001file dirname /a/b/c.v\u0002, \u0001file tail /a/b/c.v\u0002 lần lượt?", "code": [], "opts": [{"k": "A", "v": ".gz, a, /a/b, c.v"}, {"k": "B", "v": ".tar.gz, a, /a, c"}, {"k": "C", "v": ".gz, a.v, /a/b/c.v, c.v"}, {"k": "D", "v": "gz, a, b, c.v"}], "ans": ["A"], "exp": "Lệnh \u0001file\u0002 xử lý tên file/đường dẫn: extension, rootname (bỏ đuôi), dirname (thư mục), tail (tên cuối). Lab HDL dùng \u0001file tail\u0002 để chỉ in tên file.", "expcode": []}, {"id": 204, "q": "\u0001foreach a {1 2} b {x y} {puts -nonewline \"$a$b \"}\u0002 in ra?", "code": [], "opts": [{"k": "A", "v": "1x 2y"}, {"k": "B", "v": "1x 1y 2x 2y"}, {"k": "C", "v": "12 xy"}, {"k": "D", "v": "x y"}], "ans": ["A"], "exp": "Nhiều list duyệt song song theo từng bước. Đây khác với hai vòng lặp lồng nhau.", "expcode": []}, {"id": 205, "q": "Mã trả về của \u0001catch {expr 1}\u0002 và \u0001catch {error x}\u0002 lần lượt?", "code": [], "opts": [{"k": "A", "v": "0 và 1"}, {"k": "B", "v": "1 và 0"}, {"k": "C", "v": "0 và 2"}, {"k": "D", "v": "1 và 1"}], "ans": ["A"], "exp": "0 = OK, 1 = lỗi (error). Các mã khác: 2 = return, 3 = break, 4 = continue (đã thử đủ).", "expcode": []}, {"id": 206, "q": "\u0001set l2 {a b}; lappend l2 {*}$more\u0002 với more = {c d}. \u0001llength $l2\u0002 là?", "code": [], "opts": [{"k": "A", "v": "4 (\u0001{*}\u0002 bung list thành từng phần tử riêng)"}, {"k": "B", "v": "3 (thêm cả list như một phần tử)"}, {"k": "C", "v": "2"}, {"k": "D", "v": "Lỗi"}], "ans": ["A"], "exp": "Không có \u0001{*}\u0002 thì \u0001lappend l2 $more\u0002 chỉ thêm một phần tử \u0001c d\u0002 nên length là 3.", "expcode": [], "ns": 1}, {"id": 207, "q": "Lệnh nào dùng để chạy một chương trình ngoài (như \u0001date\u0002, \u0001ls\u0002) từ Tcl, và lệnh nào nạp một file Tcl khác?", "code": [], "opts": [{"k": "A", "v": "\u0001exec\u0002 và \u0001source\u0002"}, {"k": "B", "v": "\u0001source\u0002 và \u0001exec\u0002"}, {"k": "C", "v": "\u0001run\u0002 và \u0001load\u0002"}, {"k": "D", "v": "\u0001system\u0002 và \u0001include\u0002"}], "ans": ["A"], "exp": "Đã thử: \u0001exec echo hello\u0002 in \u0001hello\u0002. \u0001source file.tcl\u0002 tương tự \u0001source\u0002 trong Bash.", "expcode": []}, {"id": 208, "q": "\u0001format \"%5.2f|%-5d|%05d\" 3.14159 42 42\u0002 cho (các dấu cách đúng như trong ô)?", "code": [], "opts": [{"k": "A", "v": "\u0001 3.14|42   |00042\u0002"}, {"k": "B", "v": "\u00013.14|42|42\u0002"}, {"k": "C", "v": "\u00013.14159|42   |00042\u0002"}, {"k": "D", "v": "\u0001 3.14|   42|42000\u0002"}], "ans": ["A"], "exp": "\u0001%5.2f\u0002 rộng 5, 2 số thập phân; \u0001%-5d\u0002 căn trái rộng 5; \u0001%05d\u0002 đệm số 0 đến rộng 5.", "expcode": []}]}, {"title": "F3. Tìm lỗi (debug) trong đoạn code", "blocks": [], "questions": [{"id": 209, "q": "Đoạn Tcl này (dấu \u0001{\u0002 ở dòng mới) cho lỗi gì?", "code": ["set a 5", "if {$a > 3}", "{ puts big }"], "opts": [{"k": "A", "v": "Chạy bình thường, in big"}, {"k": "B", "v": "Lỗi \u0001wrong # args: no script following \"$a > 3\" argument\u0002"}, {"k": "C", "v": "In rỗng"}, {"k": "D", "v": "Lỗi thiếu biến a"}], "ans": ["B"], "exp": "Tcl kết thúc lệnh \u0001if\u0002 ở cuối dòng nên \u0001{\u0002 phải cùng dòng với điều kiện: \u0001if {$a > 3} { puts big }\u0002.", "expcode": []}, {"id": 210, "q": "Đoạn code này lỗi gì và sửa thế nào?", "code": ["set total 0", "foreach n {1 2 3} { set total $total + $n }"], "opts": [{"k": "A", "v": "Chạy đúng, total = 6"}, {"k": "B", "v": "Lỗi \u0001wrong # args: should be \"set varName ?newValue?\"\u0002; sửa bằng \u0001incr total $n\u0002 hoặc \u0001set total [expr {$total + $n}]\u0002"}, {"k": "C", "v": "Lỗi thiếu foreach"}, {"k": "D", "v": "total = 0"}], "ans": ["B"], "exp": "\u0001set total $total + $n\u0002 truyền 4 đối số cho \u0001set\u0002. Tcl không tự tính toán nếu thiếu \u0001expr\u0002.", "expcode": []}, {"id": 211, "q": "\u0001proc g {x} {return $x}\u0002 rồi gọi \u0001g\u0002 (không đối số). Kết quả?", "code": [], "opts": [{"k": "A", "v": "Trả rỗng"}, {"k": "B", "v": "Lỗi \u0001wrong # args: should be \"g x\"\u0002"}, {"k": "C", "v": "Trả x"}, {"k": "D", "v": "Trả 0"}], "ans": ["B"], "exp": "Tham số không có giá trị mặc định thì bắt buộc phải truyền.", "expcode": []}, {"id": 212, "q": "\u0001set l {a b c}; puts $l(0)\u0002 cho kết quả gì, và cách đúng?", "code": [], "opts": [{"k": "A", "v": "In a"}, {"k": "B", "v": "Lỗi \u0001can't read \"l(0)\": variable isn't array\u0002; đúng là \u0001lindex $l 0\u0002"}, {"k": "C", "v": "In 0"}, {"k": "D", "v": "In rỗng"}], "ans": ["B"], "exp": "Nhầm list với array. List dùng \u0001lindex\u0002, array dùng \u0001$arr(key)\u0002.", "expcode": []}, {"id": 213, "q": "\u0001set a 10; set b 3; puts [expr {$a/$b}]\u0002 in 3. Muốn ra 3.333... thì sửa thế nào?", "code": [], "opts": [{"k": "A", "v": "\u0001expr {double($a)/$b}\u0002 hoặc \u0001expr {$a/3.0}\u0002"}, {"k": "B", "v": "Dùng quotes thay braces"}, {"k": "C", "v": "Đổi \u0001/\u0002 thành \u0001//\u0002"}, {"k": "D", "v": "Không thể"}], "ans": ["A"], "exp": "Chia hai số nguyên trong Tcl cho phần nguyên. Đã thử: \u0001double($a)/$b\u0002 = 3.3333333333333335.", "expcode": []}, {"id": 214, "q": "Bash: \u0001x=1; if [$x -eq 1]; then echo y; fi\u0002 cho lỗi gì?",
