<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn tập PBL3: Bash + Tcl cho EDA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#F4F2FB;--p1:#fff;--p2:#F6F4FD;--line:#DFD9F2;--ink:#17122B;--mut:#6B6485;--acc:#6A46F0;--ok:#12805A;--okbg:#DDF5EA;--bad:#C3283C;--badbg:#FCE4E7;--warn:#B26A00;--warnbg:#FFF0D6;--star:#B77B00;--starbg:#FFF3D1;--inl:#ECE8FA;--codebg:#0B0816;--codeink:#E4DEFF;--glow:#6A46F033;--bar:#F4F2FB;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#06050B;--p1:#0C0A16;--p2:#110E1F;--line:#221B3B;--ink:#F3F1FF;--mut:#9189B0;--acc:#8B6CFF;--ok:#3DDC97;--okbg:#0B2A20;--bad:#FF6370;--badbg:#2E1019;--warn:#FFB454;--warnbg:#33230A;--star:#FFC857;--starbg:#33270B;--inl:#1A1530;--codebg:#07050F;--codeink:#DAD3FF;--glow:#7C5CFF66;--bar:#06050B}
:root[data-theme="dark"] body{background:radial-gradient(820px 460px at 50% -130px,#5B3DF545,transparent 70%),radial-gradient(520px 420px at 100% 45%,#7c5cff1a,transparent 70%),var(--bg)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.6 Inter,"Be Vietnam Pro",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button{font:inherit;color:inherit;cursor:pointer}
code,pre,.mo{font-family:"JetBrains Mono",ui-monospace,Consolas,Menlo,monospace}
code{background:var(--inl);padding:.05em .35em;border-radius:5px;font-size:.88em;word-break:break-word}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
[data-c=bash]{--c:#3DDC97}[data-c=tcl]{--c:#B79CFF}[data-c=eda]{--c:#5BC8FF}[data-c=x]{--c:#FFB454}
:root:not([data-theme="dark"]) [data-c=bash]{--c:#12805A}:root:not([data-theme="dark"]) [data-c=tcl]{--c:#6A46F0}:root:not([data-theme="dark"]) [data-c=eda]{--c:#0B7FA8}:root:not([data-theme="dark"]) [data-c=x]{--c:#B26A00}
.panel{background:var(--p1);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 70px -44px var(--glow)}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;display:flex;gap:12px;align-items:center;height:58px;padding:0 18px;background:var(--bar);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}.brand svg{width:26px;height:26px;color:var(--acc)}.brand span{color:var(--mut);font-weight:500}
.live{display:inline-flex;gap:7px;align-items:center;font-size:12.5px;border:1px solid var(--line);background:var(--p1);border-radius:999px;padding:3px 12px;color:var(--mut)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.sp1{flex:1}
#stats{display:flex;gap:6px;font-size:12.5px}#stats span{background:var(--p1);border:1px solid var(--line);border-radius:999px;padding:2px 11px;white-space:nowrap}
#search{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--p1);color:var(--ink);width:200px;max-width:100%}
.gh{background:var(--p1);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:14px}.gh:hover{border-color:var(--acc)}.sm{padding:3px 12px;font-size:13px}
.pri{background:linear-gradient(180deg,#8D70FF,#6A46F0);color:#fff;border:1px solid #A78BFF66;border-radius:999px;padding:9px 24px;font-weight:600;box-shadow:0 0 34px -8px var(--acc),inset 0 1px 0 #ffffff40}
#menu{display:none}
#wrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;padding:18px;max-width:1380px;margin:0 auto;align-items:start}
#nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100dvh - 96px - env(safe-area-inset-top,0px));overflow:auto;padding:12px;font-size:14px}
.ic{width:18px;height:18px;flex:none}
.ni{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px;color:var(--mut);line-height:1.35}
.ni:hover{background:var(--inl);color:var(--ink)}
.ni.on{background:linear-gradient(90deg,#6A46F0,#8B6CFF);color:#fff;box-shadow:0 0 24px -6px var(--acc)}
.ni .m{margin-left:auto;font-size:12px;opacity:.85;white-space:nowrap}
.ni.sub{padding:5px 10px 5px 12px;margin:1px 0 1px 20px;width:calc(100% - 20px);border-left:2px solid var(--c,var(--line));border-radius:0 8px 8px 0;font-size:13.5px}
.ni.pt .chev{margin-left:auto;transition:transform .15s}.ni.pt.o .chev{transform:rotate(90deg)}
.nh{margin:14px 10px 6px;font-size:12.5px;color:var(--mut)}
.lc{display:flex;gap:10px;align-items:center;margin-top:14px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--p2)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:linear-gradient(135deg,#6A46F0,#C084FC);color:#fff;flex:none}
.lc div{flex:1;min-width:0}.lc small{color:var(--mut);font-size:12px}
.xb{height:6px;border-radius:6px;background:var(--inl);overflow:hidden;margin:4px 0}.xb i{display:block;height:100%;background:linear-gradient(90deg,#6A46F0,#C084FC)}
main{min-width:0}
h2{font-size:20px;margin:0 0 10px;letter-spacing:-.02em}h2 small{font-size:14px;font-weight:400;color:var(--mut);margin-left:8px}
.hero{text-align:center;padding:26px 8px 30px}
.bdg{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--p1);border-radius:999px;padding:4px 14px;font-size:13px;color:var(--mut);margin-bottom:18px}.bdg i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.hero h1{font-size:clamp(32px,5vw,56px);line-height:1.08;letter-spacing:-.035em;margin:0 auto 14px;max-width:780px;font-weight:700}
.hero p{color:var(--mut);max-width:540px;margin:0 auto 22px;font-size:16px}
.hero .gh{margin-left:8px}
.dash{padding:16px}.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.dh h2{margin:0;font-size:17px}.dh span{font-size:13px;color:var(--mut)}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.st,.bx{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sl{font-size:12.5px;color:var(--mut)}.sv{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.25}.ss{font-size:12px;color:var(--ok)}.spk{width:100%;height:36px;margin-top:6px;display:block}
.dr{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:12px;margin:12px 0}
.bx h3{margin:0 0 8px;font-size:14px;font-weight:600}.bx>.bx{margin:0}
.ar{width:100%;height:170px;color:var(--ink);display:block}.dl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.ga{width:100%;max-width:250px;display:block;margin:0 auto;color:var(--ink)}.gl{text-align:center;font-weight:600;color:var(--acc)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}
th{color:var(--mut);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}tbody tr:last-child td{border-bottom:0}
.tw.doc{margin:12px 0;border:1px solid var(--line);border-radius:12px}.tw.doc td:first-child{font-weight:600}
.pl{border-radius:999px;padding:1px 10px;font-size:12px;border:1px solid;white-space:nowrap}
.pl.bad{color:var(--bad);background:var(--badbg);border-color:#ff637055}.pl.warn{color:var(--warn);background:var(--warnbg);border-color:#ffb45455}.pl.ok{color:var(--ok);background:var(--okbg);border-color:#3ddc9755}.pl.pu{color:var(--acc);background:var(--inl);border-color:#8b6cff55}
.ct{color:var(--c);font-weight:500}.mo{color:var(--mut)}
.strip{display:flex;justify-content:center;gap:clamp(18px,4.5vw,56px);flex-wrap:wrap;margin:36px 0;font-size:clamp(17px,2.2vw,24px);font-weight:600;color:var(--mut);opacity:.8;letter-spacing:-.02em}
.sh{font-size:clamp(22px,3vw,30px);letter-spacing:-.03em;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 16px}
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.bc{text-align:left;background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;min-height:190px;position:relative;overflow:hidden;color:var(--ink)}
.bc::after{content:"";position:absolute;right:-40px;bottom:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,var(--c) 0,transparent 68%);opacity:.2;pointer-events:none}
.bc:hover{border-color:var(--c);box-shadow:0 0 38px -14px var(--c)}
.orb{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--c);border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 0 22px -6px var(--c)}.orb .ic{width:22px;height:22px}
.bc b{font-size:16px;line-height:1.3}.bc small{color:var(--mut)}
.pb{height:7px;background:var(--inl);border-radius:6px;overflow:hidden;display:flex;margin-top:auto}.pb i{display:block;height:100%;background:linear-gradient(90deg,#1fbf7a,#3DDC97)}.pb i+i{background:linear-gradient(90deg,#ff6370,#ff9bb0)}
.cta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px;margin:20px 0}.cta div{flex:1;min-width:200px}.cta b{display:block}.cta span{color:var(--mut);font-size:14px}
details.ref{border:1px solid var(--line);border-radius:12px;padding:8px 16px;margin:12px 0;background:var(--p1)}details.ref summary{cursor:pointer;font-weight:600}
.chips,.tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}
.chip{background:var(--p1);border:1px solid var(--line);border-radius:999px;padding:3px 14px;font-size:13.5px}.chip i{font-style:normal;color:var(--mut);margin-left:5px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 0 18px -4px var(--acc)}.chip.on i{color:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.seg button{background:var(--p1);border:0;padding:4px 14px;font-size:13.5px}.seg .on{background:var(--acc);color:#fff}
.tg{background:var(--p1);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13.5px}.tg::before{content:"○ "}.tg.on::before{content:"● ";color:var(--acc)}
.q{background:var(--p1);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:14px;padding:18px 20px;margin:14px 0;box-shadow:0 24px 60px -44px var(--c,transparent)}
.q.ok{border-left-color:var(--ok);box-shadow:0 0 30px -14px var(--ok);animation:pop .3s}.q.bad{border-left-color:var(--bad);box-shadow:0 0 30px -14px var(--bad)}
@keyframes pop{0%{transform:scale(.985)}100%{transform:none}}
.qh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:13px;color:var(--mut)}
.qn{font-family:"JetBrains Mono",monospace;font-weight:600;font-size:14px;color:var(--c,var(--acc))}.qs{flex:1;min-width:120px;color:var(--c,var(--mut))}
.tag{border-radius:999px;padding:0 9px;font-size:12px}.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}
.star{background:none;border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13.5px}.star.on{background:var(--starbg);border-color:var(--star);color:var(--star);font-weight:600}
.qt{font-weight:600;font-size:16.5px;margin-bottom:10px}
.code{position:relative;margin:8px 0 12px}.code pre{margin:0;background:var(--codebg);color:var(--codeink);border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--c,var(--acc));border-radius:10px;padding:12px 14px;overflow-x:auto;font-size:13px;line-height:1.55}
.cp{position:absolute;top:6px;right:6px;background:#ffffff1f;color:var(--codeink);border:0;border-radius:6px;font-size:12px;padding:2px 8px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;text-align:left;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;align-items:flex-start;transition:transform .12s,box-shadow .12s}
.opt b{min-width:24px;height:24px;border-radius:7px;border:1px solid var(--mut);display:grid;place-items:center;font:600 12px "JetBrains Mono",monospace;flex:none}
.opt:not(:disabled):hover{border-color:var(--c,var(--acc));box-shadow:0 0 18px -6px var(--c,var(--acc));transform:translateX(2px)}
.opt.ok{background:var(--okbg);border-color:var(--ok);box-shadow:0 0 18px -6px var(--ok)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#06140E}
.opt.bad{background:var(--badbg);border-color:var(--bad);box-shadow:0 0 18px -6px var(--bad)}.opt.bad b{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{opacity:1}.opt.dim{opacity:.5}.q>.sm{margin-top:10px}
.exp{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--p2);border:1px dashed var(--line)}.ev{margin-bottom:4px}
.pager{display:flex;gap:12px;justify-content:center;align-items:center;margin:16px 0}
.map{display:flex;flex-wrap:wrap;gap:5px}
.mc{min-width:38px;padding:2px 4px;font:12px "JetBrains Mono",monospace;background:var(--p1);border:1px solid var(--line);border-radius:7px}
.mc.ok{background:var(--okbg);border-color:var(--ok)}.mc.bad{background:var(--badbg);border-color:var(--bad)}.mc.mk{box-shadow:inset 0 -3px 0 var(--star)}.mc.cur{outline:2px solid var(--acc)}
.empty{padding:30px 10px;color:var(--mut);text-align:center}
@media (max-width:1000px){.sg{grid-template-columns:repeat(2,1fr)}.dr{grid-template-columns:1fr}.bento{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){#wrap{display:block;padding:12px}#menu{display:inline-block}#stats,.live{display:none}#search{flex:1}
#nav{position:fixed;z-index:40;left:0;top:calc(env(safe-area-inset-top,0px) + 58px);bottom:0;max-height:none;width:min(320px,88vw);border-radius:0 16px 16px 0;transform:translateX(-105%);transition:transform .2s}#nav.open{transform:none}}
@media (max-width:600px){.bento{grid-template-columns:1fr}.hero .gh{margin:10px 0 0}}
@media (prefers-reduced-motion:reduce){#nav,.q.ok{transition:none;animation:none}}
</style>
</head>
<body>
<header id="top"><button id="menu" class="gh sm" aria-label="Mục lục">Mục lục</button><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>PBL3<span>Script Lab</span></div><span class="live"><i></i>Ôn tập trực tiếp</span><div class="sp1"></div><div id="stats"></div><input id="search" type="search" placeholder="Tìm câu hỏi…" aria-label="Tìm câu hỏi"><button id="theme" class="gh sm"></button></header>
<div id="wrap"><nav id="nav" class="panel"></nav><main id="main"><div id="bar"></div><div id="list"></div><div id="pg"></div></main></div>
<script>
const DATA=[{"title": "Mở đầu", "sections": [{"title": "Tổng quan", "blocks": [{"t": "p", "s": "ÔN TẬP TRẮC NGHIỆM"}, {"t": "p", "s": "PBL3: Lập trình Script (Bash + Tcl cho EDA), Chương 1–6"}, {"t": "p", "s": "Bám sát slide giáo trình và các lab trên lớp. 224 câu, mỗi câu có đáp án và giải thích ngay bên dưới, kèm 8 lab thực chiến và phần kiến thức mở rộng ngoài slide. Che đáp án, tự làm rồi mới đối chiếu."}], "questions": []}, {"title": "Kế hoạch ôn trong 1 ngày", "blocks": [{"t": "table", "rows": [["Khung giờ", "Việc làm"], ["Giờ 1 (sáng)", "Đọc bảng tóm tắt + làm Chương 1 và 2 (17 câu)"], ["Giờ 2–3", "Làm Chương 3 và 4 (21 câu). Đây là phần dễ ra nhất, làm kỹ"], ["Giờ 4–5", "Làm Chương 5 và 6 (19 câu)"], ["Giờ 6", "Làm Phần B: Câu bẫy (18 câu) và Phần C: Đọc code (10 câu)"], ["Giờ 7–8", "Làm Phần D: câu hỏi từ các lab trên lớp (86 câu), ưu tiên D7–D10, D12–D13 (Tcl) và D2–D4 (Bash)"], ["Giờ 9", "Gõ lại và chạy thử 2–3 lab ở Phần E (Lab 7 Slack Parser, Lab 5 cho Tcl; Lab 1 cho Bash)"], ["Giờ 10 (nếu còn thời gian)", "Phần F: đọc Bảng phân biệt các cặp dễ nhầm rồi làm F1–F4 (53 câu mở rộng, ưu tiên bảng phân biệt và F3 tìm lỗi)"], ["Cuối ngày", "Làm lại toàn bộ câu đã sai, đọc lại bảng tóm tắt"]]}], "questions": []}, {"title": "Bảng tóm tắt lý thuyết", "blocks": [{"t": "table", "rows": [["Chương", "Nội dung cần nhớ"], ["Ch1", "Flow: Frontend (RTL, Verification, Synthesis) → Backend (Floorplan/Placement, CTS, Routing, Signoff). Script-First: làm >2 lần → viết script. Regression = chạy lại tập test sau thay đổi. Bash = glue, Tcl = EDA native, Python = data, Perl = text."], ["Ch2 Bash", "\u0001cd -\u0002 \u0001cd ..\u0002 \u0001cd ~\u0002; \u0001chmod 755\u0002 / \u0001644\u0002 / \u0001u+x\u0002; \u0001>\u0002 ghi đè, \u0001>>\u0002 nối, \u00012>&1\u0002 gộp stderr, \u0001|\u0002 pipe; grep / sed / awk / find / head / tail -f / wc; \u0001VAR=\"x\"\u0002 (không dấu cách), \u0001$0\u0002 \u0001$1\u0002; \u0001set -euo pipefail\u0002."], ["Ch3 Tcl", "Mọi thứ là string. Substitution: \u0001$\u0002, \u0001[]\u0002, \u0001\\\u0002. \u0001\"\"\u0002 có substitution, \u0001{}\u0002 không. \u0001expr {$a + $b}\u0002 luôn có braces. List: list / lindex / lrange / lappend / linsert / lreplace / llength / lsearch (không thấy = -1) / lsort. Array: key-value, \u0001array set/get/names/size\u0002."], ["Ch4 Tcl", "if/elseif/else (braces bắt buộc); switch (\u0001-exact\u0002 mặc định, \u0001-glob\u0002, \u0001-regexp\u0002); foreach quan trọng nhất; for / while; break (thoát) vs continue (bỏ lần này). proc + tham số mặc định + return; global; upvar (truyền tham chiếu); catch (bắt lỗi runtime)."], ["Ch5 Tcl", "string length/index/range/first/last/match/replace/compare; format (printf-like), scan (tách chuỗi, trả số trường); regexp (\u0001\\d \\w \\s . * + ? ^ $ ()\u0002), regsub (\u0001-all\u0002); open r/w/a, gets (-1 = hết file), puts, read, close; luôn catch khi mở file."], ["Ch6 EDA", "DC (Synopsys, synthesis): analyze/elaborate → create_clock + I/O delay → compile_ultra → report → write. PrimeTime (STA): read_db, read_sdc, update_timing, report_timing (max=setup, min=hold), foreach_in_collection. Innovus (Cadence P&R): Init → Floorplan → Place → CTS → Route → Verify. Vivado: synth_1 → impl_1 → bitstream. Slack = required − arrival; <0 là vi phạm."]]}], "questions": []}]}, {"title": "Phần A. Trắc nghiệm lý thuyết theo chương", "sections": [{"title": "Chương 1: Tổng quan tự động hóa thiết kế vi mạch", "blocks": [], "questions": [{"id": 1, "q": "Thứ tự đúng của IC Design Flow?", "code": [], "opts": [{"k": "A", "v": "Synthesis → RTL Design → Routing → Placement"}, {"k": "B", "v": "RTL Design → Functional Verification → Synthesis → Floorplanning/Placement → CTS → Routing → Signoff"}, {"k": "C", "v": "Floorplanning → RTL Design → Synthesis → Routing"}, {"k": "D", "v": "RTL Design → Routing → Synthesis → Placement"}], "ans": ["B"], "exp": "Frontend = RTL Design, Functional Verification, Synthesis. Backend = Floorplanning/Placement, Clock Tree Synthesis (CTS), Routing, Signoff.", "expcode": []}, {"id": 2, "q": "Phát biểu nào KHÔNG phải hạn chế của GUI?", "code": [], "opts": [{"k": "A", "v": "Không tái tạo được (non-reproducible)"}, {"k": "B", "v": "Không mở rộng được (ví dụ 1000 test case)"}, {"k": "C", "v": "Dễ tích hợp CI/CD"}, {"k": "D", "v": "Dễ sai sót khi lặp lại"}], "ans": ["C"], "exp": "GUI không tích hợp được CI/CD (CI/CD = tự động build/test sau mỗi lần commit). Ba ý còn lại đều là hạn chế thật.", "expcode": []}, {"id": 3, "q": "Quy tắc vàng của tư duy Script-First?", "code": [], "opts": [{"k": "A", "v": "Mọi việc đều phải viết script ngay lần đầu"}, {"k": "B", "v": "Làm việc nhiều hơn 2 lần → viết script"}, {"k": "C", "v": "Chỉ viết script khi làm hơn 10 lần"}, {"k": "D", "v": "Chỉ viết script khi tool không có GUI"}], "ans": ["B"], "exp": "Script-First: thay vì hỏi “click menu nào?” thì hỏi “lệnh nào thực hiện?”. Việc lặp quá 2 lần thì viết script.", "expcode": []}, {"id": 4, "q": "Regression Testing là gì?", "code": [], "opts": [{"k": "A", "v": "Chạy test lần đầu cho một thiết kế mới"}, {"k": "B", "v": "Chạy lại tập test sau khi thay đổi thiết kế hoặc công cụ"}, {"k": "C", "v": "Kiểm tra cú pháp RTL bằng GUI"}, {"k": "D", "v": "Quay thiết kế về phiên bản cũ"}], "ans": ["B"], "exp": "Giúp phát hiện lỗi sớm, đảm bảo chất lượng sau mỗi commit. Công nghiệp chạy hơn 100000 test case mỗi ngày trên cluster.", "expcode": []}, {"id": 5, "q": "Ngôn ngữ nào được gọi là “EDA native” (ngôn ngữ gốc của tool EDA)?", "code": [], "opts": [{"k": "A", "v": "Bash"}, {"k": "B", "v": "Tcl"}, {"k": "C", "v": "Python"}, {"k": "D", "v": "Perl"}], "ans": ["B"], "exp": "Bash = glue (dán các công cụ), Tcl = EDA native, Python = data/libraries, Perl = text/regex (xu hướng giảm dần).", "expcode": []}, {"id": 6, "q": "Synthesis 50 modules: GUI mất 250 phút. Script mất 30 phút viết + 10 phút chạy. Tổng thời gian dùng script?", "code": [], "opts": [{"k": "A", "v": "10 phút"}, {"k": "B", "v": "30 phút"}, {"k": "C", "v": "40 phút"}, {"k": "D", "v": "250 phút"}], "ans": ["C"], "exp": "30 + 10 = 40 phút. Bẫy: quên cộng thời gian viết script.", "expcode": []}, {"id": 7, "q": "Bộ ba ngôn ngữ “quyền lực” theo slide?", "code": [], "opts": [{"k": "A", "v": "Bash + Tcl + Python"}, {"k": "B", "v": "Bash + Perl + C"}, {"k": "C", "v": "Tcl + Perl + Java"}, {"k": "D", "v": "Python + Perl + Tcl"}], "ans": ["A"], "exp": "Bash (nền tảng, glue) + Tcl (chuẩn EDA) + Python (dữ liệu, tăng mạnh).", "expcode": []}]}, {"title": "Chương 2: Shell Bash trong Linux", "blocks": [], "questions": [{"id": 8, "q": "\u0001cd -\u0002 làm gì?", "code": [], "opts": [{"k": "A", "v": "Lên thư mục cha"}, {"k": "B", "v": "Về home directory"}, {"k": "C", "v": "Quay về thư mục trước đó"}, {"k": "D", "v": "Xóa thư mục hiện tại"}], "ans": ["C"], "exp": "\u0001cd ..\u0002 = lên thư mục cha, \u0001cd ~\u0002 = về home, \u0001cd -\u0002 = thư mục vừa ở trước đó.", "expcode": []}, {"id": 9, "q": "\u0001chmod 755 script.sh\u0002 nghĩa là?", "code": [], "opts": [{"k": "A", "v": "Chủ: rwx; nhóm và người khác: r-x"}, {"k": "B", "v": "Mọi người đều có rwx"}, {"k": "C", "v": "Chủ: rw-; nhóm và người khác: r--"}, {"k": "D", "v": "Chỉ chủ được đọc"}], "ans": ["A"], "exp": "r=4, w=2, x=1 nên 7 = rwx, 5 = r-x. \u0001644\u0002 = rw-r--r-- (cho file báo cáo). Script automation cần \u0001chmod +x\u0002, tool thường cần 755.", "expcode": []}, {"id": 10, "q": "Lệnh \u0001dc_shell -f run.tcl > log.txt 2>&1\u0002 làm gì?", "code": [], "opts": [{"k": "A", "v": "Chỉ ghi lỗi (stderr) vào log.txt"}, {"k": "B", "v": "Chỉ ghi output thường (stdout) vào log.txt"}, {"k": "C", "v": "Ghi cả stdout và stderr vào log.txt"}, {"k": "D", "v": "Nối thêm stdout vào cuối log.txt"}], "ans": ["C"], "exp": "\u0001>\u0002 chuyển stdout vào file, \u00012>&1\u0002 gộp stderr (luồng số 2) vào cùng nơi với stdout (luồng số 1).", "expcode": [], "ns": 1}, {"id": 11, "q": "\u0001find . -name \"*.v\" | wc -l\u0002 cho kết quả gì?", "code": [], "opts": [{"k": "A", "v": "Danh sách tên các file .v"}, {"k": "B", "v": "Số file .v trong thư mục hiện tại và thư mục con"}, {"k": "C", "v": "Số dòng trong mỗi file .v"}, {"k": "D", "v": "Lỗi vì pipe sai"}], "ans": ["B"], "exp": "\u0001find\u0002 liệt kê file khớp tên, pipe \u0001|\u0002 đưa sang \u0001wc -l\u0002 để đếm số dòng, tức số file.", "expcode": []}, {"id": 12, "q": "Dòng gán biến đúng trong Bash?", "code": [], "opts": [{"k": "A", "v": "PROJECT = \"alpha\""}, {"k": "B", "v": "PROJECT=\"alpha\""}, {"k": "C", "v": "set PROJECT alpha"}, {"k": "D", "v": "$PROJECT=\"alpha\""}], "ans": ["B"], "exp": "Bash không có khoảng trắng quanh dấu \u0001=\u0002, và không dùng \u0001$\u0002 khi gán (chỉ dùng \u0001$\u0002 khi đọc). \u0001set PROJECT alpha\u0002 là cú pháp Tcl.", "expcode": []}, {"id": 13, "q": "Trong script Bash, \u0001$0\u0002 và \u0001$1\u0002 lần lượt là?", "code": [], "opts": [{"k": "A", "v": "Tham số 1 và tham số 2"}, {"k": "B", "v": "Tên script và tham số đầu tiên"}, {"k": "C", "v": "Số tham số và tên script"}, {"k": "D", "v": "Giá trị trả về và tên script"}], "ans": ["B"], "exp": "Slide: \u0001echo \"Script: $0, Arg1: $1\"\u0002.", "expcode": []}, {"id": 14, "q": "\u0001set -euo pipefail\u0002 ở đầu script production nhằm mục đích gì?", "code": [], "opts": [{"k": "A", "v": "Tăng tốc độ chạy"}, {"k": "B", "v": "Dừng script khi gặp lỗi, giúp phát hiện lỗi sớm"}, {"k": "C", "v": "Ẩn toàn bộ thông báo lỗi"}, {"k": "D", "v": "Tự động chmod +x"}], "ans": ["B"], "exp": "Best practice của Chương 2: bắt đầu bằng shebang, \u0001chmod +x\u0002, \u0001set -euo pipefail\u0002, luôn ghi log.", "expcode": []}, {"id": 15, "q": "\u0001tail -f simulation.log\u0002 dùng để làm gì?", "code": [], "opts": [{"k": "A", "v": "Xem 10 dòng đầu"}, {"k": "B", "v": "Đếm số dòng"}, {"k": "C", "v": "Theo dõi log, in thêm dòng mới khi file được ghi tiếp"}, {"k": "D", "v": "Xóa dòng cuối"}], "ans": ["C"], "exp": "\u0001head\u0002 xem phần đầu, \u0001tail\u0002 xem phần cuối, \u0001-f\u0002 (follow) tiếp tục theo dõi.", "expcode": []}, {"id": 16, "q": "Thư mục nào thường chứa các EDA tools như Synopsys, Cadence?", "code": [], "opts": [{"k": "A", "v": "/tmp/"}, {"k": "B", "v": "/var/log/"}, {"k": "C", "v": "/opt/"}, {"k": "D", "v": "~/"}], "ans": ["C"], "exp": "\u0001/opt/synopsys/\u0002, \u0001/opt/cadence/\u0002 = EDA tools; \u0001/tmp/\u0002 = file tạm; \u0001/var/log/\u0002 = log hệ thống; \u0001~/\u0002 = home.", "expcode": []}, {"id": 17, "q": "Trong \u0001if grep -q PASS logs/$name.log; then\u0002, cờ \u0001-q\u0002 có tác dụng gì?", "code": [], "opts": [{"k": "A", "v": "Tìm không phân biệt hoa thường"}, {"k": "B", "v": "Tìm đệ quy"}, {"k": "C", "v": "Không in kết quả, chỉ cho exit status để \u0001if\u0002 kiểm tra"}, {"k": "D", "v": "In dòng khớp đầu tiên"}], "ans": ["C"], "exp": "\u0001-q\u0002 = quiet. \u0001if\u0002 chỉ cần biết có khớp hay không. (Còn \u0001-r\u0002 là đệ quy, \u0001-i\u0002 là không phân biệt hoa thường.)", "expcode": []}]}, {"title": "Chương 3: Cú pháp Tcl và cấu trúc dữ liệu cơ bản", "blocks": [], "questions": [{"id": 18, "q": "Quy tắc nào về cú pháp Tcl là ĐÚNG?", "code": [], "opts": [{"k": "A", "v": "Lệnh tách bằng newline hoặc \u0001;\u0002, arguments tách bằng khoảng trắng"}, {"k": "B", "v": "Mỗi lệnh phải kết thúc bằng \u0001;\u0002"}, {"k": "C", "v": "Arguments tách bằng dấu phẩy"}, {"k": "D", "v": "Phải khai báo kiểu biến trước khi dùng"}], "ans": ["A"], "exp": "Mọi thứ trong Tcl đều là string; biến không cần khai báo kiểu.", "expcode": []}, {"id": 19, "q": "Ba loại substitution (thay thế) trong Tcl?", "code": [], "opts": [{"k": "A", "v": "\u0001$\u0002, \u0001[]\u0002, backslash"}, {"k": "B", "v": "\u0001$\u0002, \u0001{}\u0002, \u0001\"\"\u0002"}, {"k": "C", "v": "\u0001[]\u0002, \u0001{}\u0002, \u0001;\u0002"}, {"k": "D", "v": "\u0001$\u0002, \u0001#\u0002, \u0001[]\u0002"}], "ans": ["A"], "exp": "\u0001$\u0002 thay biến; \u0001[]\u0002 thay bằng kết quả của lệnh; backslash cho ký tự đặc biệt như \u0001\\n\u0002, \u0001\\t\u0002.", "expcode": []}, {"id": 20, "q": "Với \u0001set name \"World\"\u0002, lệnh \u0001set g3 {Hello $name}\u0002 cho g3 bằng?", "code": [], "opts": [{"k": "A", "v": "Hello World"}, {"k": "B", "v": "Hello $name"}, {"k": "C", "v": "Hello"}, {"k": "D", "v": "Lỗi cú pháp"}], "ans": ["B"], "exp": "Braces \u0001{}\u0002 giữ nguyên văn, không substitution. Double quotes \u0001\"\"\u0002 mới thay biến (cho Hello World).", "expcode": []}, {"id": 21, "q": "Dòng nào truyền biến đúng cho tool EDA?", "code": [], "opts": [{"k": "A", "v": "create_clock -period {$clock_period} [get_ports clk]"}, {"k": "B", "v": "create_clock -period $clock_period [get_ports clk]"}, {"k": "C", "v": "create_clock -period '$clock_period' [get_ports clk]"}, {"k": "D", "v": "create_clock -period [$clock_period] [get_ports clk]"}], "ans": ["B"], "exp": "Braces chặn substitution nên tool nhận nguyên chữ \u0001$clock_period\u0002 (sai). \u0001[ ]\u0002 sẽ chạy \u0001$clock_period\u0002 như một lệnh (sai). Sai quoting là bug phổ biến nhất trong Tcl EDA.", "expcode": []}, {"id": 22, "q": "Vì sao nên viết \u0001expr {$a + $b}\u0002 thay vì \u0001expr $a+$b\u0002?", "code": [], "opts": [{"k": "A", "v": "Để tránh double substitution và chạy nhanh hơn"}, {"k": "B", "v": "Vì \u0001expr $a+$b\u0002 sai cú pháp hoàn toàn"}, {"k": "C", "v": "Để tự động làm tròn số"}, {"k": "D", "v": "Để kết quả là chuỗi"}], "ans": ["A"], "exp": "Với braces, \u0001expr\u0002 tự xử lý biến một lần; không braces thì bị thay thế hai lần (một lần bởi interpreter, một lần bởi expr).", "expcode": []}, {"id": 23, "q": "\u0001lsearch $modules shifter\u0002 khi list không có \u0001shifter\u0002 trả về?", "code": [], "opts": [{"k": "A", "v": "0"}, {"k": "B", "v": "-1"}, {"k": "C", "v": "Chuỗi rỗng"}, {"k": "D", "v": "Lỗi"}], "ans": ["B"], "exp": "Tìm thấy thì trả chỉ số (đếm từ 0); không thấy trả -1.", "expcode": []}, {"id": 24, "q": "Tcl array là loại cấu trúc nào?", "code": [], "opts": [{"k": "A", "v": "Mảng chỉ số liên tục như C"}, {"k": "B", "v": "Associative array (key-value)"}, {"k": "C", "v": "Stack"}, {"k": "D", "v": "Chuỗi đặc biệt"}], "ans": ["B"], "exp": "Truy cập \u0001timing(setup)\u0002; có thể giả lập nhiều chiều bằng key \u0001row,col\u0002, ví dụ \u0001matrix(1,0)\u0002.", "expcode": []}, {"id": 25, "q": "\u0001lsort -integer -decreasing {3 1 4 1 5}\u0002 cho kết quả?", "code": [], "opts": [{"k": "A", "v": "1 1 3 4 5"}, {"k": "B", "v": "5 4 3 1 1"}, {"k": "C", "v": "5 4 3 1"}, {"k": "D", "v": "3 1 4 1 5"}], "ans": ["B"], "exp": "Sắp xếp số nguyên giảm dần; phần tử trùng (hai số 1) vẫn giữ.", "expcode": []}, {"id": 26, "q": "\u0001set colors {red green blue}\u0002 rồi \u0001lreplace $colors 1 2 purple pink\u0002 cho?", "code": [], "opts": [{"k": "A", "v": "red purple pink"}, {"k": "B", "v": "purple pink blue"}, {"k": "C", "v": "red green purple pink"}, {"k": "D", "v": "purple pink"}], "ans": ["A"], "exp": "\u0001lreplace\u0002 thay các phần tử từ chỉ số 1 đến 2 (green, blue) bằng purple, pink.", "expcode": []}, {"id": 27, "q": "Khi nào nên dùng braces \u0001{}\u0002 thay vì quotes \u0001\"\"\u0002?", "code": [], "opts": [{"k": "A", "v": "Khi cần thay biến trong chuỗi"}, {"k": "B", "v": "Cho thân proc/if/while, code block, list phức tạp, expr"}, {"k": "C", "v": "Khi chuỗi có khoảng trắng và cần thay biến"}, {"k": "D", "v": "Không bao giờ"}], "ans": ["B"], "exp": "Quotes dùng khi cần thay biến hoặc command, hoặc chuỗi có khoảng trắng.", "expcode": []}, {"id": 28, "q": "Sau đoạn code này, \u0001array size power\u0002 bằng?", "code": ["array set power {", "  dynamic 15.5", "  leakage 2.3", "  total   17.8", "}"], "opts": [{"k": "A", "v": "1"}, {"k": "B", "v": "3"}, {"k": "C", "v": "17.8"}, {"k": "D", "v": "6"}], "ans": ["B"], "exp": "Array có 3 key (dynamic, leakage, total). \u0001array size\u0002 đếm số key, không phải tổng giá trị.", "expcode": []}]}, {"title": "Chương 4: Điều khiển luồng và thủ tục Tcl", "blocks": [], "questions": [{"id": 29, "q": "Trong lệnh \u0001if\u0002 của Tcl, điều kiện và body phải viết thế nào?", "code": [], "opts": [{"k": "A", "v": "Bắt buộc dùng braces \u0001{}\u0002"}, {"k": "B", "v": "Bắt buộc dùng double quotes"}, {"k": "C", "v": "Dùng ngoặc tròn như C"}, {"k": "D", "v": "Tùy ý"}], "ans": ["A"], "exp": "\u0001if {$slack < 0} { ... } elseif {...} { ... } else { ... }\u0002", "expcode": []}, {"id": 30, "q": "Tùy chọn mặc định của \u0001switch\u0002 là?", "code": [], "opts": [{"k": "A", "v": "-glob"}, {"k": "B", "v": "-regexp"}, {"k": "C", "v": "-exact"}, {"k": "D", "v": "-nocase"}], "ans": ["C"], "exp": "Các tùy chọn: \u0001-exact\u0002 (mặc định), \u0001-glob\u0002, \u0001-regexp\u0002, \u0001-nocase\u0002. Nhánh còn lại dùng \u0001default\u0002.", "expcode": []}, {"id": 31, "q": "Đoạn code này in ra gì?", "code": ["foreach {name value} [list a 1 b 2] {", "  puts \"$name = $value\"", "}"], "opts": [{"k": "A", "v": "Hai dòng: a = 1 và b = 2"}, {"k": "B", "v": "Bốn dòng: a, 1, b, 2"}, {"k": "C", "v": "Một dòng: a 1 b 2"}, {"k": "D", "v": "Lỗi"}], "ans": ["A"], "exp": "\u0001foreach {name value} list\u0002 duyệt list theo từng cặp.", "expcode": []}, {"id": 32, "q": "\u0001break\u0002 và \u0001continue\u0002 khác nhau thế nào?", "code": [], "opts": [{"k": "A", "v": "\u0001break\u0002 bỏ qua lần lặp hiện tại; \u0001continue\u0002 thoát vòng lặp"}, {"k": "B", "v": "\u0001break\u0002 thoát hẳn vòng lặp; \u0001continue\u0002 bỏ qua lần lặp hiện tại để sang lần kế"}, {"k": "C", "v": "Cả hai đều thoát vòng lặp"}, {"k": "D", "v": "Cả hai đều bỏ qua lần lặp hiện tại"}], "ans": ["B"], "exp": "Slide: \u0001break\u0002 khi gặp module lỗi thì dừng; \u0001continue\u0002 để bỏ qua số chẵn.", "expcode": [], "ns": 1}, {"id": 33, "q": "Vòng lặp \u0001for {set i 0} {$i < 5} {incr i}\u0002 chạy bao nhiêu lần?", "code": [], "opts": [{"k": "A", "v": "4 lần"}, {"k": "B", "v": "5 lần (i = 0 đến 4)"}, {"k": "C", "v": "6 lần"}, {"k": "D", "v": "Vô hạn"}], "ans": ["B"], "exp": "Cú pháp: \u0001for {init} {condition} {incr} {body}\u0002. Kiểm tra điều kiện trước mỗi lần lặp.", "expcode": []}, {"id": 34, "q": "Với \u0001proc run_synthesis {design {clock_period 10}}\u0002, gọi \u0001run_synthesis alu\u0002 thì clock_period bằng?", "code": [], "opts": [{"k": "A", "v": "Lỗi thiếu tham số"}, {"k": "B", "v": "10 (giá trị mặc định)"}, {"k": "C", "v": "alu"}, {"k": "D", "v": "0"}], "ans": ["B"], "exp": "Tham số có giá trị mặc định đặt trong braces lồng: \u0001{clock_period 10}\u0002. Gọi \u0001run_synthesis cpu 5\u0002 thì bằng 5.", "expcode": []}, {"id": 35, "q": "\u0001upvar\u0002 khác \u0001global\u0002 ở điểm nào (theo slide)?", "code": [], "opts": [{"k": "A", "v": "\u0001global\u0002 truy cập biến toàn cục; \u0001upvar\u0002 truyền tham chiếu để sửa biến của nơi gọi"}, {"k": "B", "v": "Hai lệnh giống hệt nhau"}, {"k": "C", "v": "\u0001upvar\u0002 tạo biến toàn cục mới"}, {"k": "D", "v": "\u0001global\u0002 chỉ đọc, \u0001upvar\u0002 chỉ ghi"}], "ans": ["A"], "exp": "Biến trong proc mặc định là local. \u0001global debug_mode\u0002 kéo biến toàn cục vào proc; \u0001upvar\u0002 liên kết tên local với biến của nơi gọi.", "expcode": []}, {"id": 36, "q": "\u0001catch {open \"missing.txt\" r} err\u0002 khi file KHÔNG tồn tại trả về gì?", "code": [], "opts": [{"k": "A", "v": "0, err rỗng"}, {"k": "B", "v": "Khác 0, err chứa thông báo lỗi"}, {"k": "C", "v": "Script dừng ngay"}, {"k": "D", "v": "0, err chứa file handle"}], "ans": ["B"], "exp": "Nếu mở thành công, catch trả 0 và err chứa file handle (slide: \u0001set fid $err\u0002). Mục đích: bắt lỗi runtime để script không dừng đột ngột.", "expcode": []}, {"id": 37, "q": "Dấu \u0001-\u0002 giữa các pattern trong \u0001switch\u0002 (ví dụ \u0001\"*.v\" - \"*.sv\" - \"*.vh\" {...}\u0002) có nghĩa gì?", "code": [], "opts": [{"k": "A", "v": "Loại trừ pattern"}, {"k": "B", "v": "Nhiều pattern dùng chung một action"}, {"k": "C", "v": "Chú thích"}, {"k": "D", "v": "Phép trừ"}], "ans": ["B"], "exp": "Ví dụ slide: các file .v, .sv, .vh đều in “HDL source”.", "expcode": []}, {"id": 38, "q": "Trong proc, lệnh \u0001return $area\u0002 làm gì?", "code": [], "opts": [{"k": "A", "v": "In giá trị ra màn hình"}, {"k": "B", "v": "Trả giá trị về cho nơi gọi proc"}, {"k": "C", "v": "Khai báo biến toàn cục"}, {"k": "D", "v": "Thoát khỏi script"}], "ans": ["B"], "exp": "Ví dụ: \u0001set result [calculate_area 10 5]\u0002. In ra màn hình là việc của \u0001puts\u0002.", "expcode": []}]}, {"title": "Chương 5: Xử lý chuỗi và File I/O trong Tcl", "blocks": [], "questions": [{"id": 39, "q": "\u0001string index \"Hello World\" end\u0002 trả về?", "code": [], "opts": [{"k": "A", "v": "H"}, {"k": "B", "v": "d"}, {"k": "C", "v": "Hello"}, {"k": "D", "v": "11"}], "ans": ["B"], "exp": "\u0001end\u0002 = ký tự cuối. \u0001string length\u0002 mới trả về 11.", "expcode": []}, {"id": 40, "q": "\u0001string range \"Hello World\" end-4 end\u0002 trả về?", "code": [], "opts": [{"k": "A", "v": "Hello"}, {"k": "B", "v": "World"}, {"k": "C", "v": "orld"}, {"k": "D", "v": "o World"}], "ans": ["B"], "exp": "\u0001end-4\u0002 là vị trí thứ 5 tính từ cuối; lấy từ đó đến cuối được \u0001World\u0002.", "expcode": []}, {"id": 41, "q": "\u0001string first \"fox\" \"The quick brown fox jumps\"\u0002 trả về?", "code": [], "opts": [{"k": "A", "v": "12"}, {"k": "B", "v": "16"}, {"k": "C", "v": "17"}, {"k": "D", "v": "-1"}], "ans": ["B"], "exp": "Trả vị trí đầu tiên (đếm từ 0): T0 h1 e2 ␣3 q4 u5 i6 c7 k8 ␣9 b10 r11 o12 w13 n14 ␣15 f16.", "expcode": []}, {"id": 42, "q": "\u0001string match\u0002 dùng kiểu so khớp nào?", "code": [], "opts": [{"k": "A", "v": "Regex đầy đủ"}, {"k": "B", "v": "Glob (dùng ký tự đại diện như \u0001*\u0002)"}, {"k": "C", "v": "So sánh bằng tuyệt đối"}, {"k": "D", "v": "So sánh số"}], "ans": ["B"], "exp": "Ví dụ \u0001[string match \"*Error*\" $line]\u0002; thêm \u0001-nocase\u0002 để không phân biệt hoa thường. Regex dùng \u0001regexp\u0002.", "expcode": []}, {"id": 43, "q": "\u0001regexp {Module (\\w+)} \"Module adder (input a,b);\" -> name\u0002 đặt name bằng?", "code": [], "opts": [{"k": "A", "v": "Module adder"}, {"k": "B", "v": "adder"}, {"k": "C", "v": "(input a,b)"}, {"k": "D", "v": "Module"}], "ans": ["B"], "exp": "\u0001(\\w+)\u0002 là capture group (nhóm bắt). Biến đầu sau pattern (\u0001->\u0002) nhận toàn bộ phần khớp; biến thứ hai (\u0001name\u0002) nhận nhóm 1.", "expcode": []}, {"id": 44, "q": "Trong regex Tcl, \u0001\\d\u0002, \u0001\\w\u0002, \u0001\\s\u0002 lần lượt khớp?", "code": [], "opts": [{"k": "A", "v": "Chữ số; chữ, số và \u0001_\u0002; khoảng trắng"}, {"k": "B", "v": "Chữ cái; chữ số; dấu cách"}, {"k": "C", "v": "Ký tự bất kỳ; chữ số; khoảng trắng"}, {"k": "D", "v": "Đầu dòng; cuối dòng; ký tự bất kỳ"}], "ans": ["A"], "exp": "Khác: \u0001.\u0002 = ký tự bất kỳ; \u0001^\u0002 \u0001$\u0002 = đầu/cuối dòng; \u0001* + ?\u0002 = lặp 0+, 1+, 0 hoặc 1.", "expcode": []}, {"id": 45, "q": "\u0001regsub\u0002 thay thế mấy lần khi KHÔNG có \u0001-all\u0002?", "code": [], "opts": [{"k": "A", "v": "Mọi lần khớp"}, {"k": "B", "v": "Chỉ lần khớp đầu tiên"}, {"k": "C", "v": "Không thay gì"}, {"k": "D", "v": "Hai lần"}], "ans": ["B"], "exp": "Tip của slide: \u0001regsub -all\u0002 thay mọi lần khớp.", "expcode": []}, {"id": 46, "q": "Mode nào của \u0001open\u0002 dùng để ghi nối thêm vào cuối file?", "code": [], "opts": [{"k": "A", "v": "r"}, {"k": "B", "v": "w"}, {"k": "C", "v": "a"}, {"k": "D", "v": "rw"}], "ans": ["C"], "exp": "\u0001r\u0002 = đọc, \u0001w\u0002 = ghi (ghi đè), \u0001a\u0002 = append (nối thêm). Slide chỉ liệt kê ba mode r, w, a.", "expcode": []}, {"id": 47, "q": "\u0001gets $fid line\u0002 trả về giá trị nào khi hết file?", "code": [], "opts": [{"k": "A", "v": "0"}, {"k": "B", "v": "-1"}, {"k": "C", "v": "Chuỗi rỗng"}, {"k": "D", "v": "end"}], "ans": ["B"], "exp": "Vì vậy vòng đọc file viết \u0001while {[gets $fid line] >= 0} { ... }\u0002.", "expcode": []}, {"id": 48, "q": "\u0001format \"Pi: %.2f\" 3.14159\u0002 cho?", "code": [], "opts": [{"k": "A", "v": "Pi: 3.1"}, {"k": "B", "v": "Pi: 3.14"}, {"k": "C", "v": "Pi: 3.142"}, {"k": "D", "v": "Pi: 3.14159"}], "ans": ["B"], "exp": "\u0001%.2f\u0002 = số thực với 2 chữ số sau dấu thập phân. Còn \u0001%e\u0002 là dạng khoa học, \u0001%d\u0002 là số nguyên, \u0001%s\u0002 là chuỗi.", "expcode": []}, {"id": 49, "q": "\u0001scan \"temp=25.5, voltage=3.3\" \"temp=%f, voltage=%f\" t v\u0002 trả về?", "code": [], "opts": [{"k": "A", "v": "25.5"}, {"k": "B", "v": "2"}, {"k": "C", "v": "1"}, {"k": "D", "v": "3.3"}], "ans": ["B"], "exp": "\u0001scan\u0002 tách dữ liệu từ chuỗi có cấu trúc và trả về số trường đọc được. Slide dùng \u0001== 2\u0002 để kiểm tra dòng hợp lệ.", "expcode": []}]}, {"title": "Chương 6: Tích hợp EDA tools với Tcl", "blocks": [], "questions": [{"id": 50, "q": "Công cụ nào của Synopsys dùng cho phân tích thời gian tĩnh (STA)?", "code": [], "opts": [{"k": "A", "v": "Design Compiler"}, {"k": "B", "v": "PrimeTime"}, {"k": "C", "v": "Innovus"}, {"k": "D", "v": "Vivado"}], "ans": ["B"], "exp": "Design Compiler = synthesis; PrimeTime = STA; ICC2 = P&R (Synopsys). Innovus/Genus/Tempus là của Cadence; Vivado là của Xilinx.", "expcode": []}, {"id": 51, "q": "Thứ tự đúng của flow Design Compiler?", "code": [], "opts": [{"k": "A", "v": "compile → analyze → create_clock → report"}, {"k": "B", "v": "analyze/elaborate → constraints (create_clock, I/O delay) → compile → report → write"}, {"k": "C", "v": "create_clock → write → compile → analyze"}, {"k": "D", "v": "report → compile → analyze → write"}], "ans": ["B"], "exp": "Đọc RTL → Constraints → Compile (\u0001compile\u0002, \u0001compile_ultra\u0002) → Report (timing, area, power) → Output (netlist + SDC).", "expcode": []}, {"id": 52, "q": "PrimeTime: \u0001report_timing -delay_type max\u0002 kiểm tra gì? Còn \u0001-delay_type min\u0002?", "code": [], "opts": [{"k": "A", "v": "max = setup, min = hold"}, {"k": "B", "v": "max = hold, min = setup"}, {"k": "C", "v": "max = area, min = power"}, {"k": "D", "v": "max = hold, min = hold"}], "ans": ["A"], "exp": "Slide: \u0001-delay_type max\u0002 ghi ra setup_timing.rpt, \u0001-delay_type min\u0002 ghi ra hold_timing.rpt.", "expcode": []}, {"id": 53, "q": "Công thức slack và khi nào vi phạm timing?", "code": [], "opts": [{"k": "A", "v": "slack = required − arrival; slack < 0 là vi phạm"}, {"k": "B", "v": "slack = arrival − required; slack < 0 là vi phạm"}, {"k": "C", "v": "slack = required + arrival; slack > 0 là vi phạm"}, {"k": "D", "v": "slack = required − arrival; slack > 0 là vi phạm"}], "ans": ["A"], "exp": "Ví dụ: required 10.0, arrival 9.5 → slack = 0.5 (đạt). Slack âm = Setup violation.", "expcode": []}, {"id": 54, "q": "Thứ tự đúng các giai đoạn P&R trong Innovus?", "code": [], "opts": [{"k": "A", "v": "Floorplan → Routing → Placement → CTS"}, {"k": "B", "v": "Init → Floorplan → Placement → CTS → Routing → Verify"}, {"k": "C", "v": "Init → Placement → Floorplan → Routing → CTS"}, {"k": "D", "v": "Routing → CTS → Placement → Floorplan"}], "ans": ["B"], "exp": "Init (LEF, netlist) → Floorplan + power plan → Placement → CTS (clock tree) → Routing + post-route opt → Verify DRC/LVS + export DEF/GDS.", "expcode": []}, {"id": 55, "q": "Thứ tự đúng của Vivado FPGA flow?", "code": [], "opts": [{"k": "A", "v": "impl_1 → synth_1 → bitstream"}, {"k": "B", "v": "synth_1 → impl_1 → bitstream"}, {"k": "C", "v": "bitstream → synth_1 → impl_1"}, {"k": "D", "v": "synth_1 → bitstream → impl_1"}], "ans": ["B"], "exp": "\u0001launch_runs synth_1\u0002 → \u0001wait_on_run\u0002 → \u0001launch_runs impl_1\u0002 → \u0001write_bitstream\u0002, rồi \u0001report_timing_summary\u0002, \u0001report_utilization\u0002.", "expcode": []}, {"id": 56, "q": "Trong PrimeTime, để duyệt tập path (collection) lấy từ \u0001get_timing_paths\u0002 ta dùng?", "code": [], "opts": [{"k": "A", "v": "foreach"}, {"k": "B", "v": "foreach_in_collection"}, {"k": "C", "v": "while"}, {"k": "D", "v": "lsearch"}], "ans": ["B"], "exp": "Slide: \u0001foreach_in_collection path $paths { ... }\u0002. Path được phân loại reg2reg, reg2out, in2reg; dòng 3 dùng braces (giữ nguyên văn).", "expcode": []}, {"id": 59, "q": "Kết quả của \u0001puts \"2+3=[expr 2+3]\"\u0002?", "code": [], "opts": [{"k": "A", "v": "2+3=2+3"}, {"k": "B", "v": "5"}, {"k": "C", "v": "2+3=5"}, {"k": "D", "v": "Lỗi cú pháp"}], "ans": ["C"], "exp": "Phần \u0001[expr 2+3]\u0002 được thay bằng 5, phần còn lại giữ nguyên.", "expcode": []}, {"id": 60, "q": "Đoạn code này cho kết quả gì?", "code": ["set clock_period 10", "puts \"$clock_periodns\""], "opts": [{"k": "A", "v": "10ns"}, {"k": "B", "v": "Lỗi: không có biến tên clock_periodns"}, {"k": "C", "v": "clock_periodns"}, {"k": "D", "v": "$clock_periodns"}], "ans": ["B"], "exp": "Tcl lấy toàn bộ tên biến liên tục. Đúng phải viết \u0001${clock_period}ns\u0002 (như slide: \u0001Synth $design @ ${clock_period}ns\u0002).", "expcode": []}, {"id": 61, "q": "Dòng này chạy thế nào?", "code": ["puts \"hi\" # ghi chu"], "opts": [{"k": "A", "v": "In hi"}, {"k": "B", "v": "Lỗi (comment # chỉ đứng ở đầu command)"}, {"k": "C", "v": "In hi # ghi chu"}, {"k": "D", "v": "In hi ghi chu"}], "ans": ["B"], "exp": "Quy tắc: \u0001#\u0002 phải ở đầu command. Muốn comment cuối dòng phải viết \u0001puts \"hi\" ;# ghi chu\u0002.", "expcode": []}, {"id": 62, "q": "Vì sao slide viết \u00011000.0 / $freq_mhz\u0002 và \u0001double($n)\u0002 thay vì số nguyên?", "code": [], "opts": [{"k": "A", "v": "Để phép chia ra số thực (chia hai số nguyên trong Tcl cho kết quả nguyên, ví dụ 1000/300 = 3)"}, {"k": "B", "v": "Vì Tcl không nhận số nguyên"}, {"k": "C", "v": "Để tránh double substitution"}, {"k": "D", "v": "Để chạy nhanh hơn"}], "ans": ["A"], "exp": "Slide: \u0001set period_ns [expr {1000.0 / $freq_mhz}]\u0002 và \u0001expr {$total / double($n)}\u0002.", "expcode": []}, {"id": 63, "q": "\u0001string last \"the\" \"The quick brown fox jumps\"\u0002 trả về?", "code": [], "opts": [{"k": "A", "v": "0"}, {"k": "B", "v": "-1"}, {"k": "C", "v": "16"}, {"k": "D", "v": "1"}], "ans": ["B"], "exp": "Chuỗi chỉ có “The” viết hoa; so khớp phân biệt hoa thường nên không thấy, trả -1.", "expcode": []}, {"id": 64, "q": "\u0001string compare apple Apple\u0002 và \u0001string compare -nocase apple Apple\u0002 lần lượt cho?", "code": [], "opts": [{"k": "A", "v": "0 và 0"}, {"k": "B", "v": "Khác 0 và 0"}, {"k": "C", "v": "Khác 0 và khác 0"}, {"k": "D", "v": "0 và khác 0"}], "ans": ["B"], "exp": "Mặc định phân biệt hoa thường nên khác 0. Có \u0001-nocase\u0002 thì bằng nhau, trả 0. \u0001string equal -nocase\u0002 trả 1.", "expcode": []}, {"id": 65, "q": "Đoạn code này trả về?", "code": ["set f [list rtl/top.v rtl/adder.v rtl/multiplier.v]", "lsearch -all -inline -glob $f \"*mult*\""], "opts": [{"k": "A", "v": "2"}, {"k": "B", "v": "rtl/multiplier.v"}, {"k": "C", "v": "1"}, {"k": "D", "v": "Danh sách rỗng"}], "ans": ["B"], "exp": "\u0001-inline\u0002 trả về giá trị phần tử. Bỏ \u0001-inline\u0002 thì trả chỉ số 2 (đếm từ 0).", "expcode": []}, {"id": 66, "q": "\u0001lrange $fruits 1 2\u0002 với fruits = {apple banana orange grape} trả về?", "code": [], "opts": [{"k": "A", "v": "apple banana"}, {"k": "B", "v": "banana orange"}, {"k": "C", "v": "banana orange grape"}, {"k": "D", "v": "orange grape"}], "ans": ["B"], "exp": "Chỉ số bắt đầu từ 0 và lấy cả hai đầu. \u0001lindex $fruits end\u0002 = grape.", "expcode": []}, {"id": 67, "q": "\u0001array get power\u0002 trả về?", "code": [], "opts": [{"k": "A", "v": "Danh sách tên key"}, {"k": "B", "v": "Số phần tử"}, {"k": "C", "v": "Danh sách xen kẽ key value"}, {"k": "D", "v": "Giá trị đầu tiên"}], "ans": ["C"], "exp": "\u0001array names\u0002 = các key; \u0001array size\u0002 = số phần tử; \u0001array get\u0002 = cả key lẫn value.", "expcode": []}, {"id": 68, "q": "Sau khi chạy đoạn code, \u0001puts $count\u0002 in ra?", "code": ["proc incr_by {var_name amount} {", "  upvar $var_name local_ref", "  set local_ref [expr {$local_ref + $amount}]", "}", "set count 10", "incr_by count 5", "puts $count"], "opts": [{"k": "A", "v": "10"}, {"k": "B", "v": "15"}, {"k": "C", "v": "5"}, {"k": "D", "v": "Lỗi"}], "ans": ["B"], "exp": "Gọi bằng tên biến (\u0001count\u0002, không phải \u0001$count\u0002). \u0001upvar\u0002 liên kết \u0001local_ref\u0002 với \u0001count\u0002 nên sửa được biến của nơi gọi.", "expcode": []}, {"id": 69, "q": "Đoạn code in ra gì?", "code": ["foreach module [list adder err shifter] {", "  if {$module == \"err\"} {", "    puts \"Stop on error module\"", "    break", "  }", "  puts \"OK: $module\"", "}"], "opts": [{"k": "A", "v": "OK: adder / Stop on error module"}, {"k": "B", "v": "OK: adder / Stop on error module / OK: shifter"}, {"k": "C", "v": "Stop on error module"}, {"k": "D", "v": "OK: adder / OK: shifter"}], "ans": ["A"], "exp": "\u0001break\u0002 thoát hẳn vòng lặp khi gặp \u0001err\u0002, nên \u0001shifter\u0002 không bao giờ được xử lý.", "expcode": []}, {"id": 70, "q": "Đoạn code in ra gì?", "code": ["foreach num [list 1 2 3 4 5] {", "  if {$num % 2 == 0} { continue }", "  puts \"Odd: $num\"", "}"], "opts": [{"k": "A", "v": "Odd: 2 và Odd: 4"}, {"k": "B", "v": "Odd: 1, Odd: 3, Odd: 5"}, {"k": "C", "v": "Chỉ Odd: 1"}, {"k": "D", "v": "Odd: 1 đến Odd: 5"}], "ans": ["B"], "exp": "\u0001$num % 2 == 0\u0002 là số chẵn → \u0001continue\u0002 bỏ qua \u0001puts\u0002.", "expcode": []}, {"id": 71, "q": "\u0001regsub -all {\\s+} \"a  b   c\" \" \"\u0002 và bản không có \u0001-all\u0002 lần lượt cho?", "code": [], "opts": [{"k": "A", "v": "Cả hai: a b c"}, {"k": "B", "v": "a b c và a b   c"}, {"k": "C", "v": "a b   c và a b c"}, {"k": "D", "v": "Lỗi: thiếu biến đích"}], "ans": ["B"], "exp": "Không \u0001-all\u0002 chỉ thay lần khớp đầu (hai dấu cách giữa a và b); ba dấu cách giữa b và c giữ nguyên.", "expcode": [], "ns": 1}, {"id": 72, "q": "Vòng \u0001while {[gets $fid line] >= 0}\u0002 khi gặp một dòng trống thì?", "code": [], "opts": [{"k": "A", "v": "gets trả -1, vòng lặp kết thúc"}, {"k": "B", "v": "gets trả 0, vòng lặp vẫn tiếp tục"}, {"k": "C", "v": "gets báo lỗi"}, {"k": "D", "v": "gets bỏ qua dòng trống"}]  29.6, max_m = datapath"}, {"k": "B", "v": "total = 29.6, max_m = multiplier"}, {"k": "C", "v": "total = 15.5, max_m = datapath"}, {"k": "D", "v": "total = 29.6, max_m = adder"}], "ans": ["A"], "exp": "2.8 + 9.3 + 2.0 + 15.5 = 29.6; module có power lớn nhất là datapath (15.5).", "expcode": []}, {"id": 77, "q": "Gọi \u0001calculate_power_budget 100 [list cpu mem io dma]\u0002 in ra?", "code": ["proc calculate_power_budget {total mods} {", "  set n [llength $mods]", "  set each [expr {$total / double($n)}]", "  foreach m $mods { puts \"$m : $each mW\" }", "}"], "opts": [{"k": "A", "v": "4 dòng, mỗi dòng 25.0 mW"}, {"k": "B", "v": "1 dòng 100 mW"}, {"k": "C", "v": "4 dòng, mỗi dòng 100 mW"}, {"k": "D", "v": "Lỗi"}], "ans": ["A"], "exp": "n = 4; each = 100 / 4.0 = 25.0. \u0001double($n)\u0002 ép chia số thực.", "expcode": []}, {"id": 78, "q": "Với pass = 3, fail = 1, dòng Rate trong file report và giá trị proc trả về là?", "code": ["puts $f \"Rate=[expr {$pass*100.0/($pass+$fail)}]%\"", "return [expr {$fail == 0}]"], "opts": [{"k": "A", "v": "Rate=75.0%, trả về 0"}, {"k": "B", "v": "Rate=75%, trả về 1"}, {"k": "C", "v": "Rate=75.0%, trả về 1"}, {"k": "D", "v": "Rate=3%, trả về 0"}], "ans": ["A"], "exp": "3 × 100.0 / (3 + 1) = 75.0. \u0001expr {$fail == 0}\u0002 là 0 (sai) vì fail = 1.", "expcode": []}, {"id": 79, "q": "Với filename = \"alu.sv\", biến file_type bằng?", "code": ["switch -glob $filename {", "  \"*.v\"   { set file_type \"verilog\" }", "  \"*.sv\"  { set file_type \"systemverilog\" }", "  \"*.sdc\" { set file_type \"constraints\" }", "  default { set file_type \"unknown\" }", "}"], "opts": [{"k": "A", "v": "verilog"}, {"k": "B", "v": "systemverilog"}, {"k": "C", "v": "script"}, {"k": "D", "v": "unknown"}], "ans": ["B"], "exp": "\u0001*.v\u0002 không khớp “alu.sv” vì ký tự trước \u0001v\u0002 là \u0001s\u0002, không phải dấu chấm. Pattern \u0001*.sv\u0002 khớp.", "expcode": []}, {"id": 80, "q": "Đoạn code này in ra?", "code": ["set arrival_time 9.5", "set re
